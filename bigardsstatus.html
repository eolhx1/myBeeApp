<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Bigårdsstatus & Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Generera gemensam header -->
    <script src="header.js"></script>
    <script>
        laddaHeader("📊 Bigårdsstatus", '<a href="index.html">🏠 Hem</a><span> &gt; </span><span>Bigårdsstatus</span>');
    </script>

    <div class="container" style="max-width: 1000px; margin: 20px auto; padding: 0 15px;">
        <!-- Välj bigård -->
        <div class="card">
            <h3 style="margin-top: 0; color: #2c3e50;">Välj bigård att granska</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <select id="valt-bigard-dashboard" class="form-control" onchange="visaDashboard()">
                    <option value="">-- Välj bigård --</option>
                </select>
            </div>
        </div>

        <!-- Resultat-container för kupkorten -->
        <div id="dashboard-container">
            <p style="text-align: center; color: #666; margin-top: 20px;">Välj en bigård ovan för att visa snabbfakta för dess samhällen.</p>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html" class="back-link" style="color: #2c3e50; text-decoration: none;">← Tillbaka till översikten</a>
        </div>
    </div>

    <script>
        let globalData = {};

        function initDashboard() {
            // 1. Försök läsa all data direkt från sessionStorage eller localStorage
            const cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData") || localStorage.getItem("myBeeApp_globalData");

            if (cachedData) {
                try {
                    globalData = JSON.parse(cachedData);
                    fyllDashboardDirekt();
                } catch (e) {
                    console.error("Kunde inte läsa cache:", e);
                }
            }

            // 2. Hämta fräsch data i bakgrunden
            hamtaDataBakgrund();
        }

        function fyllDashboardDirekt() {
            if (!globalData.bigardar) return;

            fyllBigardsDropdown(globalData.bigardar);

            // Kolla om det skickats med ett ID i webbadressen (t.ex. ?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const urlBigardID = urlParams.get('id') || urlParams.get('BigardsID');

            if (urlBigardID) {
                let select = document.getElementById('valt-bigard-dashboard');
                for (let option of select.options) {
                    if (option.value.toLowerCase() === urlBigardID.toLowerCase()) {
                        select.value = option.value;
                        break;
                    }
                }
                if (select.value) {
                    visaDashboard();
                }
            }
        }

        async function hamtaDataBakgrund() {
            const WEB_APP_URL = localStorage.getItem("myBeeApp_url");
            if (!WEB_APP_URL) {
                return;
            }

            if (!navigator.onLine) return;

            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                if (data && !data.status) {
                    globalData = data;
                    sessionStorage.setItem("myBeeApp_globalData", JSON.stringify(data));
                    
                    let valtInnan = document.getElementById('valt-bigard-dashboard').value;
                    fyllBigardsDropdown(globalData.bigardar || []);
                    if (valtInnan && !document.getElementById('valt-bigard-dashboard').value) {
                        document.getElementById('valt-bigard-dashboard').value = valtInnan;
                        visaDashboard();
                    }
                }
            } catch (error) {
                console.error("Kunde inte hämta färsk data i bakgrunden:", error);
            }
        }

        function fyllBigardsDropdown(bigardar) {
            let select = document.getElementById('valt-bigard-dashboard');
            let nuvarandeVal = select.value;
            
            select.innerHTML = '<option value="">-- Välj bigård --</option>';
            bigardar.forEach(b => {
                let opt = document.createElement('option');
                let id = b.BigardsID || b.ID;
                let namn = b.Bigardsnamn || b.BigardsNamn || b.Namn || id;
                opt.value = id;
                opt.textContent = namn;
                select.appendChild(opt);
            });

            if (nuvarandeVal) {
                select.value = nuvarandeVal;
            }
        }

        function visaDashboard() {
            let valtBigardID = document.getElementById('valt-bigard-dashboard').value;
            let container = document.getElementById('dashboard-container');
            container.innerHTML = "";

            if (!valtBigardID) {
                container.innerHTML = '<p style="text-align: center; color: #666; margin-top: 20px;">Välj en bigård ovan för att visa snabbfakta för dess samhällen.</p>';
                return;
            }

            let samhallen = (globalData.samhallen || []).filter(s => String(s.BigardsID || s.Bigård) === String(valtBigardID));

            if (samhallen.length === 0) {
                container.innerHTML = '<div class="card"><p style="color: #777; text-align: center; margin: 0;">Inga samhällen registrerade i denna bigård.</p></div>';
                return;
            }

            let grid = document.createElement('div');
            grid.className = 'dashboard-grid';

            const nuvarandeAr = 2026;

            samhallen.forEach(s => {
                let samhallsID = s.SamhallsID || s.SamhällsID || s.ID;
                let drottning = (globalData.drottningar || []).find(d => String(d.SamhallsID || d.SamhällsID) === String(samhallsID) && (d.Status === "Aktiv i kupa" || !d.Status));
                
                let drottningText = "Ingen aktiv drottning registrerad";
                let kortBorderColor = "#e67e22";

                if (drottning) {
                    let drottningAr = parseInt(drottning.DrottningAr || drottning.Argang) || nuvarandeAr;
                    let alder = nuvarandeAr - drottningAr;
                    if (alder < 0) alder = 0;
                    let alderStr = alder === 0 ? "Årets (0 år)" : `${alder} år`;
                    
                    drottningText = `👑 ${drottning.Namn || 'Namnlös'} (${drottning.Ras || 'Okänd ras'})<br>📅 Årgång: ${drottningAr} (${alderStr}) | Färg: ${drottning.Farg || '-'}`;
                    if (alder >= 2) kortBorderColor = "#c0392b";
                }

                let skotselLoggar = (globalData.skotsel || []).filter(sk => String(sk.SamhallsID || sk.Samhälle || sk.SamhällsID) === String(samhallsID));
                skotselLoggar.sort((a, b) => new Date(b.Datum) - new Date(a.Datum));
                
                let senasteSkotsel = skotselLoggar.length > 0 ? skotselLoggar[0] : null;
                let skotselText = "Inga registreringar ännu";

                if (senasteSkotsel) {
                    let dat = senasteSkotsel.Datum ? String(senasteSkotsel.Datum).substring(0, 10) : "";
                    let anteckning = senasteSkotsel.Anteckningar || senasteSkotsel.Behandling || "Utförd åtgärd";
                    skotselText = `<strong>${dat}:</strong> ${anteckning}`;
                }

                let kupNamn = s.Kupbenamning || s.SamhallsNamn || s.Namn || samhallsID;

                let card = document.createElement('div');
                card.className = 'kupa-card';
                card.style.borderLeftColor = kortBorderColor;
                card.innerHTML = `
                    <h4>🏠 ${kupNamn}</h4>
                    <div class="info-row">${drottningText}</div>
                    <div class="latast-händelse">
                        <div style="font-size: 0.8rem; color: #777; margin-bottom: 2px;">Senaste händelse / koll:</div>
                        ${skotselText}
                    </div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        initDashboard();
    </script>
</body>
</html>
