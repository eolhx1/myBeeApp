<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Bigårdsstatus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header och API -->
    <script src="header.js"></script>
    <script src="api.js"></script>
    <script>
        let breadcrumbs = '<div style="display: flex; align-items: center; gap: 0.4rem;"><a href="index.html" style="color: white; text-decoration: none;">🏠 Hem</a><span> &gt; </span><span>Bigårdsstatus</span></div>';

        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Här får du en snabb och samlad överblick över statusen för alla dina samhällen i en vald bigård.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Översikt:</strong> Välj vilken bigård du vill granska i listan högst upp.</li>
                <li><strong>Samhällskort:</strong> Varje kupa visas som ett eget kort med information om drottning, ålder och den senaste händelsen.</li>
            </ul>
        `;

        laddaHeader("📊 Bigårdsstatus", breadcrumbs, "Om Bigårdsstatus", infoInnehall);
    </script>

    <div class="container">
        <!-- Välj bigård -->
        <div class="card">
            <h3>Välj bigård att granska</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <select id="valt-bigard-status" name="BigardsID">
                    <option value="">Laddar bigårdar...</option>
                </select>
            </div>
        </div>

        <!-- Behållare för samhällskort -->
        <div id="samhallen-lista" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Fylls dynamiskt av JS -->
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="index.html" style="color: #34495e; text-decoration: none; font-size: 0.9rem;">← Tillbaka till översikten</a>
        </div>
    </div>

        <script>
        // Byt ut BARA init-funktionen mot detta:
        async function init() {
            let cachedData = sessionStorage.getItem("myBeeApp_allData");
            if (cachedData) {
                try {
                    let parsedData = JSON.parse(cachedData);
                    fyllBigardarDropdown(parsedData);
                    return;
                } catch (e) {
                    console.error("Kunde inte tolka cachad data", e);
                }
            }

            let allData = await hamtaData();
            if (allData) {
                fyllBigardarDropdown(allData);
            } else {
                document.getElementById('valt-bigard-status').innerHTML = '<option value="">Kunde inte ladda bigårdar</option>';
                document.getElementById('samhallen-lista').innerHTML = "<p>Kunde inte ladda data.</p>";
            }
        }

        // --- Låt resten av koden ligga kvar precis som den är nedanför ---

        function fyllBigardarDropdown(data) {
            let bigårdar = data.bigardar || [];
            let bigardSelect = document.getElementById('valt-bigard-status');
            
            bigardSelect.innerHTML = '<option value="">-- Välj bigård --</option>';

            if (bigårdar.length === 0) {
                bigardSelect.innerHTML = '<option value="">Inga bigårdar inlagda</option>';
                return;
            }

            bigårdar.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b.BigardsID;
                opt.textContent = b.Namn;
                bigardSelect.appendChild(opt);
            });

            let valtBigardID = sessionStorage.getItem("myBeeApp_valdBigardStatus");
            if (valtBigardID && bigårdar.some(b => String(b.BigardsID) === String(valtBigardID))) {
                bigardSelect.value = valtBigardID;
            } else if (bigårdar.length > 0) {
                bigardSelect.value = bigårdar[0].BigardsID;
            }

            visaSamhällen(data);
        }

        function visaSamhällen(dataProvided = null) {
            const valtBigardsID = document.getElementById('valt-bigard-status').value;
            sessionStorage.setItem("myBeeApp_valdBigardStatus", valtBigardsID);

            let allData = dataProvided;
            if (!allData) {
                let cachedData = sessionStorage.getItem("myBeeApp_allData");
                if (cachedData) allData = JSON.parse(cachedData);
            }

            let listaDiv = document.getElementById('samhallen-lista');
            listaDiv.innerHTML = "";

            if (!valtBigardsID || !allData) {
                listaDiv.innerHTML = "<p>Välj en bigård ovan för att se status.</p>";
                return;
            }

            let allaSamhällen = allData.samhallen || [];
            let skotselLoggar = allData.skotsel || [];
            let minaSamhällen = allaSamhällen.filter(s => String(s.BigardsID) === String(valtBigardsID));

            if (minaSamhällen.length === 0) {
                listaDiv.innerHTML = "<p>Inga kupor/samhällen registrerade i denna bigård.</p>";
                return;
            }

            minaSamhällen.forEach(samhälle => {
                let minaLoggar = skotselLoggar.filter(l => String(l.SamhallsID) === String(samhälle.SamhallsID));
                minaLoggar.sort((a, b) => new Date(b.Datum) - new Date(a.Datum));
                let senasteLogg = minaLoggar.length > 0 ? minaLoggar[0] : null;

                let drottningText = "Ingen aktiv drottning registrerad";
                if (samhälle.DrottningAr || samhälle.DrottningFarg || samhälle.DrottningRas) {
                    let ras = samhälle.DrottningRas ? `(${samhälle.DrottningRas})` : '';
                    let färg = samhälle.DrottningFarg ? `Färg: ${samhälle.DrottningFarg}` : 'Färg: Ej märkt';
                    let årgång = samhälle.DrottningAr ? `Årgång: ${samhälle.DrottningAr}` : '';
                    drottningText = `👑 Drottning ${samhälle.DrottningNamn || ''} ${ras}<br>📅 ${årgång} | 🎨 ${färg}`;
                }

                let händelseText = "Inga händelser registrerade ännu.";
                if (senasteLogg) {
                    let kortDatum = senasteLogg.Datum ? senasteLogg.Datum.substring(0, 10) : "";
                    let delar = [];
                    if (senasteLogg.Drottningsett) delar.push(`👑 ${senasteLogg.Drottningsett}`);
                    if (senasteLogg.Svarmlystnad) delar.push(`🐝 Svärmlystnad: ${senasteLogg.Svarmlystnad}`);
                    if (senasteLogg.Temperament) delar.push(` Humör: ${senasteLogg.Temperament}`);
                    if (senasteLogg.SkattadMangd) delar.push(`🍯 Skörd: ${senasteLogg.SkattadMangd}`);
                    if (senasteLogg.Anteckningar) delar.push(`<em>"${senasteLogg.Anteckningar}"</em>`);
                    
                    händelseText = `<strong>${kortDatum}:</strong> ${delar.join(' | ') || 'Skötselbesök utfört'}`;
                }

                let kort = document.createElement('div');
                kort.className = 'card';
                kort.style.borderLeft = '5px solid #e67e22';
                kort.innerHTML = `
                    <h3 style="margin-top: 0; color: #2c3e50; display: flex; justify-content: space-between; align-items: center;">
                        <span>🏠 ${samhälle.Kupbenamning || 'Kupa'}</span>
                    </h3>
                    <p style="margin: 0.4rem 0; font-size: 0.95rem; color: #34495e;">${drottningText}</p>
                    <div style="background: #f8f9f9; padding: 0.6rem; border-radius: 6px; border: 1px solid #e5e7e9; margin-top: 0.6rem; font-size: 0.9rem;">
                        <span style="font-size: 0.75rem; color: #7f8c8d; display: block; margin-bottom: 0.2rem;">SENASTE HÄNDELSE / KOLL</span>
                        ${händelseText}
                    </div>
                `;
                listaDiv.appendChild(kort);
            });
        }

        document.getElementById('valt-bigard-status').addEventListener('change', () => visaSamhällen(null));

        init();
    </script>

</body>
</html>
