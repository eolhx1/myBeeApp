<!-- Filnamn: kalender.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Drag- & Blomningskalender</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Generera gemensam header med brödsmulor och info-knapp -->
    <script src="header.js"></script>
    <script>
        // Info-knappen inbakad i brödsmulorna
        let breadcrumbs = '<div style="display: flex; align-items: center; gap: 0.4rem;"><a href="index.html" style="color: white; text-decoration: none;">🏠 Hem</a><span> &gt; </span><span>Kalender</span></div><button class="info-btn" onclick="oppnaInfoModal()" title="Om sidan">i</button>';

        // Informationstext till modalen som genereras av header.js
        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Här följer du säsongens växtlighet och ser när de viktigaste dragväxterna för bin brukar blomma i din zon.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Normal blomningstid:</strong> Få koll på när draget sätter igång för sälg, raps, fruktträd, mjölkört med flera.</li>
                <li><strong>Historiska noteringar:</strong> Jämför årets säsong med tidigare noteringar om när dragen faktiskt inträffade.</li>
                <li><strong>Molnsynk:</strong> Hämtar uppdaterad blomningsdata direkt från Google Sheets och fungerar sömlöst med appens cachning.</li>
            </ul>
        `;

        laddaHeader("🌸 Drag- & Blomningskalender", breadcrumbs, "Om Drag- & Blomningskalendern", infoInnehall);
    </script>

    <div class="container" style="max-width: 800px; margin: 20px auto; padding: 0 15px;">
        <div class="card">
            <h3 style="margin-top: 0; color: #2c3e50;">Säsongens dragväxter</h3>
            <p style="color: #666; font-size: 0.9rem;">
                Här ser du när de viktiga dragväxterna brukar blomma i din zon, kopplat till historiska noteringar om när dragen skedde.
            </p>
            <div id="blomnings-lista">
                <p style="color: #777;">Laddar blomningsdata...</p>
            </div>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html" class="back-link" style="color: #2c3e50; text-decoration: none;">← Tillbaka till översikten</a>
        </div>
    </div>

    <script>
        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        async function laddaKalenderData() {
            if (!WEB_APP_URL) {
                window.location.href = "index.html";
                return;
            }

            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");
            if (cachedData) {
                try {
                    let data = JSON.parse(cachedData);
                    visaKalender(data.blomning || []);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            }

            if (navigator.onLine) {
                try {
                    let response = await fetch(WEB_APP_URL);
                    let data = await response.json();
                    sessionStorage.setItem("myBeeApp_globalData", JSON.stringify(data));
                    visaKalender(data.blomning || []);
                } catch (error) {
                    console.error("Fel vid hämtning från molnet:", error);
                    if (!cachedData) {
                        document.getElementById('blomnings-lista').innerHTML = "<p style='color: red;'>Kunde inte hämta kalenderdata.</p>";
                    }
                }
            }
        }

        function visaKalender(blommor) {
            let listaDiv = document.getElementById('blomnings-lista');
            listaDiv.innerHTML = "";

            if (!blommor || blommor.length === 0) {
                listaDiv.innerHTML = "<p style='color: #777;'>Inga växter inlagda i kalendern ännu.</p>";
                return;
            }

            blommor.forEach(b => {
                let card = document.createElement('div');
                card.className = 'bloom-card';
                card.innerHTML = `
                    <h4 style="margin: 0 0 5px 0; color: #2c3e50;">🌱 ${b.VäxtNamn || b.VaxtNamn || 'Växt'}</h4>
                    <p style="margin: 0 0 5px 0; font-size: 0.9rem;"><strong>Normal blomning:</strong> ${b.NormalTid || 'Ej angivet'}</p>
                    <p style="margin: 0; font-size: 0.9rem; color: #555;"><em>Anteckning / Historik:</em> ${b.Anteckningar || 'Inga anteckningar sparade.'}</p>
                `;
                listaDiv.appendChild(card);
            });
        }

        laddaKalenderData();
    </script>
</body>
</html>
