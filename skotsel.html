<!-- Filnamn: skotsel.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Skötselkort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header -->
<script src="header.js"></script>
<script src="utils.js"></script>
    <script>
        laddaHeader("📝 Skötselkort", '<a href="index.html">🏠 Hem</a><span> &gt; </span><span id="bread-bigard">Bigård</span>');
    </script>

    <!-- Dolt formulär för att lägga till samhälle -->
    <div class="container" id="samhalle-form-container" style="display: none; margin-top: 1rem;">
        <div class="card" style="border: 2px solid #3498db;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin-top: 0; color: #2c3e50;">➕ Lägg till nytt samhälle i bigården</h3>
                <button onclick="toggleSamhalleFormModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">❌</button>
            </div>
            <form id="samhalle-form">
                <div class="form-group">
                    <label for="kupnamn">Kupbenämning (t.ex. Kupa 1):</label>
                    <input type="text" id="kupnamn" name="Kupbenamning" placeholder="Kupa 1" required>
                </div>
                <div class="form-group">
                    <label for="drottning-ar">Drottningens årgång / märkning:</label>
                    <input type="text" id="drottning-ar" name="DrottningAr" placeholder="T.ex. 2024 (eller Grön)">
                </div>
                <div class="form-group">
                    <label for="samhalle-anteckningar">Anteckningar om samhället:</label>
                    <textarea id="samhalle-anteckningar" name="Anteckningar" placeholder="T.ex. Lugn buckfast-drottning..."></textarea>
                </div>
                <button type="submit" class="btn" style="background-color: #3498db;" id="samhalle-btn">Spara samhälle</button>
            </form>
        </div>
    </div>

    <div class="container">
        <h2 id="bigard-titel" style="margin-top: 0;">Laddar bigård...</h2>

        <!-- Samhällen -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="margin: 0;">Samhällen / Kupor</h3>
                <!-- Diskret kugghjul för att hantera/lägga till samhällen -->
                <button onclick="toggleSamhalleFormModal()" title="Lägg till nytt samhälle" style="background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 0 0.5rem; line-height: 1;">⚙️</button>
            </div>
            <div id="samhalle-lista">
                <p>
                    Laddar samhällen...
                </p>
            </div>
        </div>


        <!-- Skötselformulär -->
        <div class="card">
            <h3>Ny besökslogg / skötsel</h3>
            <form id="skotsel-form">
                <div class="form-group">
                    <label for="valt-samhalle">Välj samhälle / kupa:</label>
                    <select id="valt-samhalle" name="SamhallsID" required>
                        <option value="">Laddar samhällen...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="datum">Besöksdatum:</label>
                    <input type="date" id="datum" name="Datum" required>
                </div>

                <div class="form-group">
                    <label for="drottning">Drottning observerad?</label>
                    <select id="drottning" name="Drottningsett">
                        <option value="">-- Välj status --</option>
                        <option value="Ja - Sett drottningen">Ja - Sett drottningen</option>
                        <option value="Ej sett, men färska ägg finns">Ej sett, men färska ägg finns</option>
                        <option value="Ej sett / Osäker status">Ej sett / Osäker status</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="svarmlystnad">Svärmlystnad:</label>
                    <select id="svarmlystnad" name="Svarmlystnad">
                        <option value="">-- Välj status --</option>
                        <option value="Inga svärmceller">Inga svärmceller</option>
                        <option value="Drönarbyggda svärmceller">Drönarbyggda svärmceller</option>
                        <option value="Fulla svärmceller (åtgärd krävs!)">Fulla svärmceller (åtgärd krävs!)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="temperament">Temperament / Humör:</label>
                    <select id="temperament" name="Temperament">
                        <option value="">-- Välj humör --</option>
                        <option value="Lugna och snälla">Lugna och snälla</option>
                        <option value="Normala">Normala</option>
                        <option value="Aggressiva / Stickiga">Aggressiva / Stickiga</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="anteckningar">Anteckningar från besöket:</label>
                    <textarea id="anteckningar" name="Anteckningar" placeholder="T.ex. Gav en skattlåda till, foderstatus OK..."></textarea>
                </div>


                <!-- Dragspelsknapp för Bihälsa & Sjukdomskontroll -->
                <div style="margin: 1rem 0 0.5rem 0; border-top: 2px dashed #27ae60; padding-top: 1rem;">
                    <button type="button" onclick="toggleBihalsaSection()" style="background: #27ae60; color: white; border: none; padding: 0.8rem 1rem; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                        <span>🔬 Bihälsa, Varroanedfall & Sjukdomskontroll</span>
                        <span id="bihalsa-arrow">▼</span>
                    </button>
                </div>

                <div id="bihalsaSection" style="display: none; background: #fdfefe; padding: 1rem; border: 1px solid #27ae60; border-radius: 4px; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label for="kvalsternedfall">Varroanedfall (antal kvalster):</label>
                        <input type="number" id="kvalsternedfall" placeholder="T.ex. 5 st (eller bottenbrädesräkning)">
                    </div>

                    <div class="form-group">
                        <label for="sjukdomskontroll">Sjukdomskontroll / Avvikelser:</label>
                        <textarea id="sjukdomskontroll" placeholder="T.ex. Inga tecken på kalkyngel, säckyngel eller yngelröta. Allt frisk yngelbild."></textarea>
                    </div>
                </div>

                <!-- Dragspelsknapp för Skörd -->
                <div style="margin: 1rem 0 0.5rem 0; border-top: 2px dashed #f39c12; padding-top: 1rem;">
                    <button type="button" onclick="toggleSkordSection()" style="background: #e67e22; color: white; border: none; padding: 0.8rem 1rem; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                        <span>🍯 Honungsskörd (Skattad mängd)</span>
                        <span id="skord-arrow">▼</span>
                    </button>
                </div>

                <div id="skordSection" style="display: none; background: #fdfefe; padding: 1rem; border: 1px solid #e67e22; border-radius: 4px; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label for="skattadMangd">Skattad mängd honung (kilon eller lådor):</label>
                        <input type="text" id="skattadMangd" placeholder="T.ex. 15 kg eller 1 skattlåda">
                    </div>
                </div>

                <!-- Dragspelsknapp för Fodring -->
                <div style="margin: 1rem 0 0.5rem 0; border-top: 2px dashed #3498db; padding-top: 1rem;">
                    <button type="button" onclick="toggleFoderSection()" style="background: #3498db; color: white; border: none; padding: 0.8rem 1rem; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                        <span>🍯 Fodring & Proteintillskott</span>
                        <span id="foder-arrow">▼</span>
                    </button>
                </div>

                <div id="foderSection" style="display: none; background: #fdfefe; padding: 1rem; border: 1px solid #3498db; border-radius: 4px; margin-bottom: 1rem;">

                    <!-- Del 1: Kolhydratfoder -->
                    <h4 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 0.3rem;">Kolhydratfoder (Socker / Deg)</h4>
                    <div class="form-group">
                        <label for="fodertyp">Typ:</label>
                        <select id="fodertyp" name="Fodertyp">
                            <option value="">-- Ingen kolhydratgivning --</option>
                            <option value="Sockerlösning (1:1 / 3:2)">Sockerlösning</option>
                            <option value="Färdigt foder (ApiInvert / Sirap)">Färdigt foder (Sirap)</option>
                            <option value="Foderdeg (Fond)">Foderdeg (Fond)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fodermangd">Mängd (kg / liter):</label>
                        <input type="text" id="fodermangd" placeholder="T.ex. 12 kg socker">
                    </div>

                    <!-- Del 2: Proteinfoder / Pollenersättning -->
                    <h4 style="margin-top: 1rem; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 0.3rem;">Proteinfoder / Pollenersättning</h4>
                    <div class="form-group">
                        <label for="proteintyp">Typ av tillskott:</label>
                        <select id="proteintyp" name="Proteintyp">
                            <option value="">-- Inget proteintillskott --</option>
                            <option value="Neopoll">Neopoll (Pollenkaka)</option>
                            <option value="ApiPollen">ApiPollen</option>
                            <option value="Hemmagjord pollenkaka">Hemmagjord pollenkaka (pollen + socker)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="proteinmangd">Antal kakor / Vikt:</label>
                        <input type="text" id="proteinmangd" placeholder="T.ex. 1 kaka (500g)">
                    </div>

                </div>





                <!-- Dragspelsknapp för Läkemedelsjournal (Lagkrav) -->
                <div style="margin: 1.5rem 0 1rem 0; border-top: 2px dashed #e67e22; padding-top: 1rem;">
                    <button type="button" onclick="toggleLakemedelsJournal()" style="background: #f39c12; color: white; border: none; padding: 0.8rem 1rem; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                        <span>💊 Registrera läkemedelsbehandling (Läkemedelsjournal)</span>
                        <span id="journal-arrow">▼</span>
                    </button>
                </div>

                <!-- Den utfällbara sektionen (dold som standard) -->
                <div id="lakemedelsJournalSection" style="display: none; background: #fdfefe; padding: 1rem; border: 1px solid #f39c12; border-radius: 4px; margin-bottom: 1rem;">
                    <p style="font-size: 0.85rem; color: #7f8c8d; margin-top: 0; margin-bottom: 1rem;">
                        Fylls endast i vid faktisk behandling (krav enligt EU/Jordbruksverket).
                    </p>

                    <div class="form-group">
                        <label for="lakemedel">Läkemedel:</label>
                        <input type="text" id="lakemedel" placeholder="T.ex. Myrsyra 60%, Oxalsyra">
                    </div>

                    <div class="form-group">
                        <label for="diagnos">Diagnos / Orsak:</label>
                        <input type="text" id="diagnos" placeholder="T.ex. Varroakontroll / Varroabehandling">
                    </div>

                    <div class="form-group">
                        <label for="mangd">Mängd och styrka:</label>
                        <input type="text" id="mangd" placeholder="T.ex. 40 ml per kupa">
                    </div>

                    <div class="form-group">
                        <label for="tid">Klockslag (Tid):</label>
                        <input type="time" id="tid">
                    </div>

                    <div class="form-group">
                        <label for="leverantor">Leverantör / Inköpsställe:</label>
                        <input type="text" id="leverantor" placeholder="T.ex. Biodlarna / Utländsk leverantör">
                    </div>

                    <div class="form-group">
                        <label for="veterinar">Förskrivande veterinär (om tillämpligt):</label>
                        <input type="text" id="veterinar" placeholder="Lämna tomt om ej anvisat av vet.">
                    </div>

                    <div class="form-group">
                        <label for="karenstid">Karenstid (dygn):</label>
                        <input type="number" id="karenstid" placeholder="T.ex. 0 eller antal dygn">
                    </div>
                </div>


                <button type="submit" class="btn" id="submit-btn">Spara besök</button>
            </form>
        </div>

        <!-- Historik -->
        <div class="card">
            <h3>Tidigare besök</h3>
            <div id="historik-lista">
                <p>
                    Laddar historik...
                </p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('datum').valueAsDate = new Date();

        const urlParams = new URLSearchParams(window.location.search);
        const bigardsId = urlParams.get('id');

        if (!bigardsId) {
            alert("Ingen bigård vald.");
            window.location.href = "index.html";
        }

        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        function toggleSamhalleFormModal() {
            const container = document.getElementById('samhalle-form-container');
            if (container.style.display === "none") {
                container.style.display = "block";
                container.scrollIntoView({
                    behavior: 'smooth'
                });
            } else {
                container.style.display = "none";
            }
        }

        async function laddaData() {
            if (!WEB_APP_URL) {
                window.location.href = "index.html";
                return;
            }

            let allData = null;
            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");

            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    bearbetaOchVisaData(allData);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            } else {
                document.getElementById('historik-lista').innerHTML = "<p>Laddar data från molnet...</p>";
            }

            if (navigator.onLine) {
                try {
                    let response = await fetch(WEB_APP_URL);
                    allData = await response.json();

                    sessionStorage.setItem("myBeeApp_globalData", JSON.stringify(allData));
                    bearbetaOchVisaData(allData);

                } catch (error) {
                    console.error("Fel vid laddning:", error);
                    if (!cachedData) {
                        document.getElementById('historik-lista').innerHTML = "<p>Kunde inte ladda historik.</p>";
                    }
                }
            }
        }

        function bearbetaOchVisaData(data) {
            let bigårdar = data.bigardar || [];
            let allaSamhällen = data.samhallen || [];
            let skotselLoggar = data.skotsel || [];

            let aktuell = bigårdar.find(b => b.BigardsID === bigardsId);
            if (aktuell) {
                document.getElementById('bigard-titel').textContent = `Bigård: ${aktuell.Namn}`;
                document.getElementById('bread-bigard').textContent = aktuell.Namn;
            }

            let samhalleListaDiv = document.getElementById('samhalle-lista');
            samhalleListaDiv.innerHTML = "";

            let samhalleSelect = document.getElementById('valt-samhalle');
            samhalleSelect.innerHTML = '<option value="">-- Välj kupa --</option>';

            let minaSamhällen = allaSamhällen.filter(s => s.BigardsID === bigardsId);

            if (minaSamhällen.length === 0) {
                samhalleListaDiv.innerHTML = "<p>Inga samhällen tillagda i denna bigård ännu.</p>";
                samhalleSelect.innerHTML = '<option value="">Inga samhällen inlagda ännu</option>';
            } else {
                minaSamhällen.forEach(s => {
                    let sItem = document.createElement('div');
                    sItem.className = 'log-item';
                    sItem.style.borderLeftColor = '#3498db';
                    sItem.innerHTML = `
                    <p><strong>🏠 ${s.Kupbenamning}</strong> ${s.DrottningAr ? `(Drottning år: ${s.DrottningAr})`: ''}</p>
                    ${s.Anteckningar ? `<p><em>"${s.Anteckningar}"</em></p>`: ''}
                    `;
                    samhalleListaDiv.appendChild(sItem);

                    let opt = document.createElement('option');
                    opt.value = s.SamhallsID;
                    opt.textContent = s.Kupbenamning + (s.DrottningAr ? ` (Drottning: ${s.DrottningAr})`: '');
                    samhalleSelect.appendChild(opt);
                });
            }

            let historikDiv = document.getElementById('historik-lista');
            historikDiv.innerHTML = "";

            let minaLoggar = skotselLoggar.filter(s => s.BigardsID === bigardsId);

            if (minaLoggar.length === 0) {
                historikDiv.innerHTML = "<p>Inga sparade besök för denna bigård ännu.</p>";
            } else {
                minaLoggar.slice().reverse().forEach(logg => {
                    let matchadKupa = minaSamhällen.find(s => s.SamhallsID === logg.SamhallsID);
                    let kupaNamn = matchadKupa ? matchadKupa.Kupbenamning: "Gemensam / Okänd kupa";

                    let drottningText = logg.Drottningsett || logg.Drottning || "Ej angivet";
                    let svarmText = logg.Svarmlystnad || "Ej angivet";
                    let tempText = logg.Temperament || "Ej angivet";

                    let extraInfoHTML = "";
                    if (logg.Lakemedel) {
                        extraInfoHTML += `<p style="color: #d35400; margin: 0.2rem 0;">💊 <strong>Läkemedel:</strong> ${logg.Lakemedel} (${logg.Diagnos || 'Behandling'}) - Mängd: ${logg.Mangd || '-'}, Karenstid: ${logg.Karenstid || 0} dygn</p>`;
                    }
                    if (logg.Kvalsternedfall) {
                        extraInfoHTML += `<p style="margin: 0.2rem 0;">🔬 <strong>Varroanedfall:</strong> ${logg.Kvalsternedfall} st</p>`;
                    }
                    if (logg.Sjukdomskontroll) {
                        extraInfoHTML += `<p style="margin: 0.2rem 0;">📋 <strong>Sjukdomskontroll:</strong> ${logg.Sjukdomskontroll}</p>`;
                    }
                    if (logg.SkattadMangd) {
                        extraInfoHTML += `<p style="color: #e67e22; margin: 0.2rem 0;">🍯 <strong>Skörd:</strong> ${logg.SkattadMangd}</p>`;
                    }

                    let kortDatum = logg.Datum ? logg.Datum.substring(0, 10): "";

                    let item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                    <p><strong>📅 ${kortDatum}</strong> ${logg.Tid ? `kl ${logg.Tid}`: ''} &nbsp;|&nbsp; <em>🏠 ${kupaNamn}</em></p>
                    <p>👑 ${drottningText}</p>
                    <p>🐝 Svärmlystnad: ${svarmText} | Humör: ${tempText}</p>
                    ${logg.Anteckningar ? `<p><em>"${logg.Anteckningar}"</em></p>`: ''}
                    ${extraInfoHTML}
                    `;
                    historikDiv.appendChild(item);
                });
            }

            fyllIBefintligLoggOmFinns()
        }

        function fyllIBefintligLoggOmFinns() {
            const valtSamhallsID = document.getElementById("valt-samhalle").value;
            const valtDatum = document.getElementById("datum").value;
            const submitBtn = document.getElementById("submit-btn");

            if (!valtSamhallsID || !valtDatum) {
                submitBtn.textContent = "Spara besök";
                return;
            }

            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");
            if (!cachedData) return;

            try {
                let parsedData = JSON.parse(cachedData);
                let skotselLoggar = parsedData.skotsel || [];

                let matchadLogg = skotselLoggar.find(s => {
                    if (!s.Datum) return false;
                    let loggDatumKort = s.Datum.substring(0, 10);
                    return s.SamhallsID === valtSamhallsID && loggDatumKort === valtDatum;
                });

                if (matchadLogg) {
                    submitBtn.textContent = "Uppdatera besök";

                    document.getElementById("drottning").value = matchadLogg.Drottningsett || matchadLogg.Drottning || "";
                    document.getElementById("svarmlystnad").value = matchadLogg.Svarmlystnad || "";
                    document.getElementById("temperament").value = matchadLogg.Temperament || "";
                    document.getElementById("anteckningar").value = matchadLogg.Anteckningar || "";
                    document.getElementById("tid").value = matchadLogg.Tid || "";

                    document.getElementById("kvalsternedfall").value = matchadLogg.Kvalsternedfall || "";
                    document.getElementById("sjukdomskontroll").value = matchadLogg.Sjukdomskontroll || "";
                    if (matchadLogg.Kvalsternedfall || matchadLogg.Sjukdomskontroll) {
                        document.getElementById("bihalsaSection").style.display = "block";
                        document.getElementById("bihalsa-arrow").textContent = "▲";
                    }

                    document.getElementById("skattadMangd").value = matchadLogg.SkattadMangd || "";
                    if (matchadLogg.SkattadMangd) {
                        document.getElementById("skordSection").style.display = "block";
                        document.getElementById("skord-arrow").textContent = "▲";
                    }
					
document.getElementById("fodertyp").value = matchadLogg.Fodertyp || "";
document.getElementById("fodermangd").value = matchadLogg.Fodermangd || "";

document.getElementById("proteintyp").value = matchadLogg.Proteintyp || "";
document.getElementById("proteinmangd").value = matchadLogg.Proteinmangd || "";

                    document.getElementById("lakemedel").value = matchadLogg.Lakemedel || "";
                    document.getElementById("diagnos").value = matchadLogg.Diagnos || "";
                    document.getElementById("mangd").value = matchadLogg.Mangd || "";
                    document.getElementById("leverantor").value = matchadLogg.Leverantor || "";
                    document.getElementById("veterinar").value = matchadLogg.Veterinar || "";
                    document.getElementById("karenstid").value = matchadLogg.Karenstid || "";

                    if (matchadLogg.Lakemedel || matchadLogg.Diagnos || matchadLogg.Mangd) {
                        document.getElementById("lakemedelsJournalSection").style.display = "block";
                        document.getElementById("journal-arrow").textContent = "▲";
                    }
                } else {
                    submitBtn.textContent = "Spara besök";

                    document.getElementById("drottning").value = "";
                    document.getElementById("svarmlystnad").value = "";
                    document.getElementById("temperament").value = "";

                    document.getElementById("anteckningar").value = "";
                    document.getElementById("lakemedel").value = "";
                    document.getElementById("diagnos").value = "";
                    document.getElementById("mangd").value = "";
                    document.getElementById("tid").value = "";
                    document.getElementById("leverantor").value = "";
                    document.getElementById("veterinar").value = "";
                    document.getElementById("karenstid").value = "";
                    document.getElementById("kvalsternedfall").value = "";
                    document.getElementById("sjukdomskontroll").value = "";
                    document.getElementById("skattadMangd").value = "";
document.getElementById("fodertyp").value = "";
document.getElementById("fodermangd").value = "";

document.getElementById("proteintyp").value = "";
document.getElementById("proteinmangd").value = "";

                    document.getElementById("bihalsaSection").style.display = "none";
                    document.getElementById("bihalsa-arrow").textContent = "▼";
                    document.getElementById("skordSection").style.display = "none";
                    document.getElementById("skord-arrow").textContent = "▼";
                    document.getElementById("lakemedelsJournalSection").style.display = "none";
                    document.getElementById("journal-arrow").textContent = "▼";
                }

            } catch (err) {
                console.error("Kunde inte söka efter befintlig logg för autofyll", err);
            }
        }

        document.getElementById('valt-samhalle').addEventListener('change', fyllIBefintligLoggOmFinns);
        document.getElementById('datum').addEventListener('change', fyllIBefintligLoggOmFinns);

        function toggleLakemedelsJournal() {
            const section = document.getElementById("lakemedelsJournalSection");
            const arrow = document.getElementById("journal-arrow");
            if (section.style.display === "none") {
                section.style.display = "block";
                arrow.textContent = "▲";
            } else {
                section.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function toggleBihalsaSection() {
            const section = document.getElementById("bihalsaSection");
            const arrow = document.getElementById("bihalsa-arrow");
            if (section.style.display === "none") {
                section.style.display = "block";
                arrow.textContent = "▲";
            } else {
                section.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function toggleSkordSection() {
            const section = document.getElementById("skordSection");
            const arrow = document.getElementById("skord-arrow");
            if (section.style.display === "none") {
                section.style.display = "block";
                arrow.textContent = "▲";
            } else {
                section.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function toggleFoderSection() {
            const section = document.getElementById("foderSection");
            const arrow = document.getElementById("foder-arrow");
            if (section.style.display === "none") {
                section.style.display = "block";
                arrow.textContent = "▲";
            } else {
                section.style.display = "none";
                arrow.textContent = "▼";
            }
        }


        document.getElementById('samhalle-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const samhalleBtn = document.getElementById('samhalle-btn');
            samhalleBtn.disabled = true;
            samhalleBtn.textContent = "Sparar samhälle...";

            const autoSamhallsID = skapaID("SH");
            const formDataSamhalle = {
                sheet: "Samhallen",
                SamhallsID: autoSamhallsID,
                BigardsID: bigardsId,
                Kupbenamning: document.getElementById('kupnamn').value,
                DrottningAr: document.getElementById('drottning-ar').value,
                Anteckningar: document.getElementById('samhalle-anteckningar').value
            };

            if (!navigator.onLine) {
                sparaTillOfflineKoe(formDataSamhalle);
                alert("Ingen internettäckning! Samhället har sparats lokalt och synkas automatiskt när du får täckning igen.");
                samhalleBtn.disabled = false;
                samhalleBtn.textContent = "Spara samhälle";
                document.getElementById('samhalle-form').reset();
                document.getElementById('samhalle-form-container').style.display = "none";
                return;
            }

            try {
                let response = await fetch(WEB_APP_URL + "?sheet=Samhallen", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(formDataSamhalle)
                });
                let result = await response.json();

                if (result && (result.status === "success" || result.result === "success")) {
                    alert("Samhället har sparats till molnet!");
                    document.getElementById('samhalle-form').reset();
                    document.getElementById('samhalle-form-container').style.display = "none";
                    sessionStorage.removeItem("myBeeApp_globalData");
                    sessionStorage.removeItem("myBeeApp_allData");
                    laddaData();
                } else {
                    throw new Error(result.message || "Okänt fel");
                }
            } catch (error) {
                console.warn("Kunde inte nå servern, sparar samhället lokalt i kö...", error);
                sparaTillOfflineKoe(formDataSamhalle);
                alert("Tappade anslutningen. Samhället är sparat lokalt och synkas senare!");
                document.getElementById('samhalle-form').reset();
                document.getElementById('samhalle-form-container').style.display = "none";
            } finally {
                samhalleBtn.disabled = false;
                samhalleBtn.textContent = "Spara samhälle";
            }
        });

        document.getElementById('skotsel-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Sparar...";

            const valtSamhallsID = document.getElementById("valt-samhalle").value;
            const valtDatum = document.getElementById("datum").value;

            let befintligtSkotselID = "";
            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");
            if (cachedData) {
                try {
                    let parsedData = JSON.parse(cachedData);
                    let skotselLoggar = parsedData.skotsel || [];
                    let matchadLogg = skotselLoggar.find(s => {
                        if (!s.Datum) return false;
                        return s.SamhallsID === valtSamhallsID && s.Datum.substring(0, 10) === valtDatum;
                    });
                    if (matchadLogg && matchadLogg.SkotselID) {
                        befintligtSkotselID = matchadLogg.SkotselID;
                    }
                } catch (err) {
                    console.error("Kunde inte matcha befintlig logg vid sparande", err);
                }
            }

            const skotselID = befintligtSkotselID || skapaID("S");

            const formData = {
                sheet: "Skotsel",
                SkotselID: skotselID,
                BigardsID: bigardsId,
                SamhallsID: valtSamhallsID,
                Datum: valtDatum,
                Drottningsett: document.getElementById("drottning").value,
                Svarmlystnad: document.getElementById("svarmlystnad").value,
                Temperament: document.getElementById("temperament").value,
                Anteckningar: document.getElementById("anteckningar").value,
                Lakemedel: document.getElementById("lakemedel").value,
                Diagnos: document.getElementById("diagnos").value,
                Mangd: document.getElementById("mangd").value,
                Tid: document.getElementById("tid").value,
                Leverantor: document.getElementById("leverantor").value,
                Veterinar: document.getElementById("veterinar").value,
                Karenstid: document.getElementById("karenstid").value,
                Kvalsternedfall: document.getElementById("kvalsternedfall").value,
                Sjukdomskontroll: document.getElementById("sjukdomskontroll").value,
                SkattadMangd: document.getElementById("skattadMangd").value,
				
                Fodertyp: document.getElementById("fodertyp").value,
                Fodermangd: document.getElementById("fodermangd").value,
				
Proteintyp: document.getElementById("proteintyp").value,
Proteinmangd: document.getElementById("proteinmangd").value
            };

            if (!navigator.onLine) {
                sparaTillOfflineKoe(formData);
                alert("Ingen internettäckning! Besöket har sparats lokalt på enheten och synkas automatiskt när du är online.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Spara besök";
                window.location.href = `skotsel.html?id=${bigardsId}`;
                return;
            }

            try {
                let response = await fetch(WEB_APP_URL + "?sheet=Skotsel", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(formData)
                });
                let result = await response.json();

                if (result && (result.status === "success" || result.result === "success")) {
                    alert(befintligtSkotselID ? "Besöket har uppdaterats till molnet!": "Besöket har sparats till molnet!");

                    sessionStorage.removeItem("myBeeApp_globalData");
                    sessionStorage.removeItem("myBeeApp_allData");
                    laddaData();
                } else {
                    throw new Error(result.message || "Okänt fel");
                }
            } catch (error) {
                console.warn("Kunde inte nå servern, sparar besöket lokalt i kö...", error);
                sparaTillOfflineKoe(formData);
                alert("Tappade anslutningen till molnet. Besöket är sparat lokalt och synkas senare!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Spara besök";
            }
        });

        function sparaTillOfflineKoe(newItem) {
            let koe = JSON.parse(localStorage.getItem("myBeeApp_offlineKoe") || "[]");
            koe.push(newItem);
            localStorage.setItem("myBeeApp_offlineKoe", JSON.stringify(koe));
        }

        laddaData();
    </script>
