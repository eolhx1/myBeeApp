<!-- Filnamn: skotsel.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Skötselkort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header -->
    <script src="header.js"></script>
    <script>
        laddaHeader("📝 Skötselkort", '<a href="index.html">🏠 Hem</a><span>&gt;</span><span id="bread-bigard">Bigård</span>');
    </script>

    <!-- Dolt formulär för att lägga till samhälle -->
    <div class="container" id="samhalle-form-container" style="display: none; margin-top: 1rem;">
        <div class="card" style="border: 2px solid #3498db;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin-top: 0; color: #2c3e50;">➕ Lägg till nytt samhälle i bigården</h3>
                <button onclick="toggleSamhalleFormModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">❌</button>
            </div>
            <form id="samhalle-form">
                <div class="form-group">
                    <label for="kupnamn">Kupbenämning (t.ex. Kupa 1):</label>
                    <input type="text" id="kupnamn" name="Kupbenamning" placeholder="Kupa 1" required>
                </div>
                <div class="form-group">
                    <label for="drottning-ar">Drottningens årgång / märkning:</label>
                    <input type="text" id="drottning-ar" name="DrottningAr" placeholder="T.ex. 2024 (eller Grön)">
                </div>
                <div class="form-group">
                    <label for="samhalle-anteckningar">Anteckningar om samhället:</label>
                    <textarea id="samhalle-anteckningar" name="Anteckningar" placeholder="T.ex. Lugn buckfast-drottning..."></textarea>
                </div>
                <button type="submit" class="btn" style="background-color: #3498db;" id="samhalle-btn">Spara samhälle</button>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- Snabbknapp för att öppna formuläret för att lägga till samhälle direkt på sidan -->
        <div style="margin-bottom: 1rem;">
            <button onclick="toggleSamhalleFormModal()" class="btn" style="background-color: #27ae60;">➕ Lägg till nytt samhälle</button>
        </div>

        <h2 id="bigard-titel" style="margin-top: 0;">Laddar bigård...</h2>

        <!-- Samhällen -->
        <div class="card">
            <h3>Samhällen / Kupor</h3>
            <div id="samhalle-lista">
                <p>Laddar samhällen...</p>
            </div>
        </div>

        <!-- Skötselformulär -->
        <div class="card">
            <h3>Ny besökslogg / skötsel</h3>
            <form id="skotsel-form">
                <div class="form-group">
                    <label for="valt-samhalle">Välj samhälle / kupa:</label>
                    <select id="valt-samhalle" name="SamhallsID" required>
                        <option value="">Laddar samhällen...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="datum">Besöksdatum:</label>
                    <input type="date" id="datum" name="Datum" required>
                </div>

                <div class="form-group">
                    <label for="drottning">Drottning observerad?</label>
                    <select id="drottning" name="Drottningsett">
                        <option value="Ja - Sett drottningen">Ja - Sett drottningen</option>
                        <option value="Ej sett, men färska ägg finns">Ej sett, men färska ägg finns</option>
                        <option value="Ej sett / Osäker status">Ej sett / Osäker status</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="svarmlystnad">Svärmlystnad:</label>
                    <select id="svarmlystnad" name="Svarmlystnad">
                        <option value="Inga svärmceller">Inga svärmceller</option>
                        <option value="Drönarbyggda svärmceller">Drönarbyggda svärmceller</option>
                        <option value="Fulla svärmceller (åtgärd krävs!)">Fulla svärmceller (åtgärd krävs!)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="temperament">Temperament / Humör:</label>
                    <select id="temperament" name="Temperament">
                        <option value="Lugna och snälla">Lugna och snälla</option>
                        <option value="Normala">Normala</option>
                        <option value="Aggressiva / Stickiga">Aggressiva / Stickiga</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="anteckningar">Anteckningar från besöket:</label>
                    <textarea id="anteckningar" name="Anteckningar" placeholder="T.ex. Gav en skattlåda till, foderstatus OK..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">Spara besök</button>
            </form>
        </div>

        <!-- Historik -->
        <div class="card">
            <h3>Tidigare besök</h3>
            <div id="historik-lista">
                <p>Laddar historik...</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('datum').valueAsDate = new Date();

        const urlParams = new URLSearchParams(window.location.search);
        const bigardsId = urlParams.get('id');

        if (!bigardsId) {
            alert("Ingen bigård vald.");
            window.location.href = "index.html";
        }

        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        function toggleSamhalleFormModal() {
            const container = document.getElementById('samhalle-form-container');
            if (container.style.display === "none") {
                container.style.display = "block";
                container.scrollIntoView({ behavior: 'smooth' });
            } else {
                container.style.display = "none";
            }
        }

        async function laddaData() {
            if (!WEB_APP_URL) {
                window.location.href = "index.html";
                return;
            }

            let allData = null;
            let cachedData = sessionStorage.getItem("myBeeApp_allData");

            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    bearbetaOchVisaData(allData);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            } else {
                document.getElementById('historik-lista').innerHTML = "<p>Laddar data från molnet...</p>";
            }

            try {
                let response = await fetch(WEB_APP_URL);
                allData = await response.json();
                
                sessionStorage.setItem("myBeeApp_allData", JSON.stringify(allData));
                
                bearbetaOchVisaData(allData);

            } catch (error) {
                console.error("Fel vid laddning:", error);
                if (!cachedData) {
                    document.getElementById('historik-lista').innerHTML = "<p>Kunde inte ladda historik.</p>";
                }
            }
        }

        function bearbetaOchVisaData(data) {
            let bigårdar = data.bigardar || [];
            let allaSamhällen = data.samhallen || [];
            let skotselLoggar = data.skotsel || [];

            let aktuell = bigårdar.find(b => b.BigardsID === bigardsId);
            if (aktuell) {
                document.getElementById('bigard-titel').textContent = `Bigård: ${aktuell.Namn}`;
                document.getElementById('bread-bigard').textContent = aktuell.Namn;
            }

            let samhalleListaDiv = document.getElementById('samhalle-lista');
            samhalleListaDiv.innerHTML = "";

            let samhalleSelect = document.getElementById('valt-samhalle');
            samhalleSelect.innerHTML = '<option value="">-- Välj kupa --</option>';

            let minaSamhällen = allaSamhällen.filter(s => s.BigardsID === bigardsId);

            if (minaSamhällen.length === 0) {
                samhalleListaDiv.innerHTML = "<p>Inga samhällen tillagda i denna bigård ännu.</p>";
                samhalleSelect.innerHTML = '<option value="">Inga samhällen inlagda ännu</option>';
            } else {
                minaSamhällen.forEach(s => {
                    let sItem = document.createElement('div');
                    sItem.className = 'log-item';
                    sItem.style.borderLeftColor = '#3498db';
                    sItem.innerHTML = `
                        <p><strong>🏠 ${s.Kupbenamning}</strong> ${s.DrottningAr ? `(Drottning år: ${s.DrottningAr})` : ''}</p>
                        ${s.Anteckningar ? `<p><em>"${s.Anteckningar}"</em></p>` : ''}
                    `;
                    samhalleListaDiv.appendChild(sItem);

                    let opt = document.createElement('option');
                    opt.value = s.SamhallsID;
                    opt.textContent = s.Kupbenamning + (s.DrottningAr ? ` (Drottning: ${s.DrottningAr})` : '');
                    samhalleSelect.appendChild(opt);
                });
            }

            let historikDiv = document.getElementById('historik-lista');
            historikDiv.innerHTML = "";

            let minaLoggar = skotselLoggar.filter(s => s.BigardsID === bigardsId);

            if (minaLoggar.length === 0) {
                historikDiv.innerHTML = "<p>Inga sparade besök för denna bigård ännu.</p>";
                return;
            }

            minaLoggar.reverse().forEach(logg => {
                let matchadKupa = minaSamhällen.find(s => s.SamhallsID === logg.SamhallsID);
                let kupaNamn = matchadKupa ? matchadKupa.Kupbenamning : "Gemensam / Okänd kupa";

                let drottningText = logg.Drottningsett || logg.Drottning || "Ej angivet";
                let svarmText = logg.Svarmlystnad || "Ej angivet";
                let tempText = logg.Temperament || "Ej angivet";

                let item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <p><strong>📅 ${logg.Datum}</strong> &nbsp;|&nbsp; <em>🏠 ${kupaNamn}</em></p>
                    <p>👑 ${drottningText}</p>
                    <p>🐝 Svärmlystnad: ${svarmText} | Humör: ${tempText}</p>
                    ${logg.Anteckningar ? `<p><em>"${logg.Anteckningar}"</em></p>` : ''}
                `;
                historikDiv.appendChild(item);
            });
        }

        document.getElementById('samhalle-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const samhalleBtn = document.getElementById('samhalle-btn');
            samhalleBtn.disabled = true;
            samhalleBtn.textContent = "Sparar samhälle...";

            const autoSamhallsID = "SH" + Math.floor(1000 + Math.random() * 9000);

            const formDataSamhalle = {
                SamhallsID: autoSamhallsID,
                BigardsID: bigardsId,
                Kupbenamning: document.getElementById('kupnamn').value,
                DrottningAr: document.getElementById('drottning-ar').value,
                Anteckningar: document.getElementById('samhalle-anteckningar').value
            };

            try {
                let response = await fetch(WEB_APP_URL + "?sheet=Samhallen", {
                    method: "POST",
                    mode: "cors",
                    redirect: "follow",
                    body: JSON.stringify(formDataSamhalle)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    alert("Samhället har sparats!");
                    document.getElementById('kupnamn').value = "";
                    document.getElementById('drottning-ar').value = "";
                    document.getElementById('samhalle-anteckningar').value = "";
                    document.getElementById('samhalle-form-container').style.display = "none";
                    
                    sessionStorage.removeItem("myBeeApp_allData");
                    
                    samhalleBtn.disabled = false;
                    samhalleBtn.textContent = "Spara samhälle";
                    laddaData();
                } else {
                    alert("Ett fel uppstod när samhället skulle sparas.");
                    samhalleBtn.disabled = false;
                    samhalleBtn.textContent = "Spara samhälle";
                }
            } catch (error) {
                console.error("Fel:", error);
                alert("Kunde inte nå servern.");
                samhalleBtn.disabled = false;
                samhalleBtn.textContent = "Spara samhälle";
            }
        });

        document.getElementById('skotsel-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Sparar...";

            const autoID = "S" + Math.floor(1000 + Math.random() * 9000);

            const formData = {
                SkotselID: autoID,
                BigardsID: bigardsId,
                SamhallsID: document.getElementById('valt-samhalle').value,
                Datum: document.getElementById('datum').value,
                Drottningsett: document.getElementById('drottning').value,
                Svarmlystnad: document.getElementById('svarmlystnad').value,
                Temperament: document.getElementById('temperament').value,
                Anteckningar: document.getElementById('anteckningar').value
            };

            try {
                let response = await fetch(WEB_APP_URL + "?sheet=Skotsel", {
                    method: "POST",
                    mode: "cors",
                    redirect: "follow",
                    body: JSON.stringify(formData)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    alert("Besöket har sparats!");
                    document.getElementById('anteckningar').value = "";
                    
                    sessionStorage.removeItem("myBeeApp_allData");
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Spara besök";
                    laddaData();
                } else {
                    alert("Ett fel uppstod när besöket skulle sparas.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Spara besök";
                }
            } catch (error) {
                console.error("Fel:", error);
                alert("Kunde inte nå servern.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Spara besök";
            }
        });

        laddaData();
    </script>
</body>
</html>
