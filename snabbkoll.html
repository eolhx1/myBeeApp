<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Snabbkoll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header och API -->
    <script src="header.js"></script>
<script src="/myBeeApp/api.js"></script>

    <script>
        let breadcrumbs = '<div style="display: flex; align-items: center; gap: 0.4rem;"><a href="index.html" style="color: white; text-decoration: none;">🏠 Hem</a><span> &gt; </span><span>Snabbkoll</span></div>';

        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Använd snabbkollen för att göra en snabb och effektiv anteckning direkt vid kuporna utan att behöva fylla i onödiga detaljer.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>1. Välj bigård & kupa:</strong> Markera vart besöket har skett.</li>
                <li><strong>2. Checklista:</strong> Bocka av det viktigaste.</li>
                <li><strong>3. Spara:</strong> Skickas direkt till molnet och sparas i historiken.</li>
            </ul>
        `;

        laddaHeader("⚡ Snabbkoll", breadcrumbs, "Om Snabbkoll", infoInnehall);
    </script>

    <div class="container">
        <form id="snabbkoll-form">
            <!-- Välj Bigård -->
            <div class="card">
                <h3>Välj bigård & kupa</h3>
                <div class="form-group">
                    <label for="snabb-bigard">Bigård:</label>
                    <select id="snabb-bigard" name="BigardsID" required>
                        <option value="">Laddar bigårdar...</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="snabb-samhalle">Samhälle / Kupa:</label>
                    <select id="snabb-samhalle" name="SamhallsID" required>
                        <option value="">-- Välj först bigård --</option>
                    </select>
                </div>
            </div>

            <!-- Snabb-alternativ -->
            <div class="card">
                <h3>Snabbstatus</h3>
                <div class="form-group">
                    <label>Drottningstatus:</label>
                    <select id="snabb-drottning" name="Drottningsett">
                        <option value="">-- Välj --</option>
                        <option value="Drottning sedd">Drottning sedd</option>
                        <option value="Ägg ses">Ägg ses</option>
                        <option value="Drottning ej sedd / Osäker">Drottning ej sedd / Osäker</option>
                        <option value="Ny drottning tillsatt">Ny drottning tillsatt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Svärmlystnad:</label>
                    <select id="snabb-svarm" name="Svarmlystnad">
                        <option value="">-- Välj --</option>
                        <option value="Inga svärmceller">Inga svärmceller</option>
                        <option value="Trekantsceller / Byggceller">Trekantsceller / Byggceller</option>
                        <option value="Sträckta svärmceller">Sträckta svärmceller</option>
                        <option value="Svärmad / Befintlig svärm">Svärmad / Befintlig svärm</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Temperament / Humör:</label>
                    <select id="snabb-temp" name="Temperament">
                        <option value="">-- Välj --</option>
                        <option value="Lugna bin">Lugna bin</option>
                        <option value="Normala / Följsamma">Normala / Följsamma</option>
                        <option value="Stickiga / Aggressiva">Stickiga / Aggressiva</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Allmän status / Foder:</label>
                    <select id="snabb-status" name="AllmanStatus">
                        <option value="">-- Välj --</option>
                        <option value="Gott om mat">Gott om mat</option>
                        <option value="Risk för foderbrist">Risk för foderbrist</option>
                        <option value="Starkt samhälle">Starkt samhälle</option>
                        <option value="Svagt samhälle">Svagt samhälle</option>
                    </select>
                </div>
            </div>

            <!-- Anteckningar -->
            <div class="card">
                <h3>Anteckningar</h3>
                <div class="form-group" style="margin-bottom: 0;">
                    <textarea id="snabb-anteckningar" name="Anteckningar" rows="3" placeholder="Egna anteckningar från besöket..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 0.9rem; font-size: 1rem;">Spara snabbkoll</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="index.html" style="color: #34495e; text-decoration: none; font-size: 0.9rem;">← Tillbaka till översikten</a>
        </div>
    </div>

    <script>
        async function init() {
            let allData = await hamtaData();
            if (allData) {
                fyllBigardarDropdown(allData);
            } else {
                document.getElementById('snabb-bigard').innerHTML = '<option value="">Kunde inte ladda data</option>';
            }
        }

        function fyllBigardarDropdown(data) {
            let bigårdar = data.bigardar || [];
            let bigardSelect = document.getElementById('snabb-bigard');
            
            bigardSelect.innerHTML = '<option value="">-- Välj bigård --</option>';

            if (bigårdar.length === 0) {
                bigardSelect.innerHTML = '<option value="">Inga bigårdar inlagda</option>';
                return;
            }

            bigårdar.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b.BigardsID;
                opt.textContent = b.Namn;
                bigardSelect.appendChild(opt);
            });

            let valtBigardID = sessionStorage.getItem("myBeeApp_valdBigardSnabb");
            if (valtBigardID && bigårdar.some(b => String(b.BigardsID) === String(valtBigardID))) {
                bigardSelect.value = valtBigardID;
            }

            uppdateraKuporDropdown(data);
        }

        function uppdateraKuporDropdown(dataProvided = null) {
            const valtBigardsID = document.getElementById('snabb-bigard').value;
            sessionStorage.setItem("myBeeApp_valdBigardSnabb", valtBigardsID);

            let allData = dataProvided;
            if (!allData) {
                let cachedData = sessionStorage.getItem("myBeeApp_allData");
                if (cachedData) allData = JSON.parse(cachedData);
            }

            let samhalleSelect = document.getElementById('snabb-samhalle');
            samhalleSelect.innerHTML = '<option value="">-- Välj kupa --</option>';

            if (!valtBigardsID || !allData) return;

            let allaSamhällen = allData.samhallen || [];
            let minaSamhällen = allaSamhällen.filter(s => String(s.BigardsID) === String(valtBigardsID));

            if (minaSamhällen.length === 0) {
                samhalleSelect.innerHTML = '<option value="">Inga samhällen i denna bigård</option>';
                return;
            }

            minaSamhällen.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.SamhallsID;
                opt.textContent = `${s.Kupbenamning || 'Kupa'} ${s.DrottningAr ? `(Drottning år: ${s.DrottningAr})` : ''}`;
                samhalleSelect.appendChild(opt);
            });
        }

        document.getElementById('snabb-bigard').addEventListener('change', () => uppdateraKuporDropdown(null));

        document.getElementById('snabbkoll-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            let submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = "Sparar...";

            let formData = new FormData(this);
            let data = Object.fromEntries(formData.entries());

            data.sheet = "Skotsel";
            data.SkotselID = "SK" + Math.floor(1000 + Math.random() * 9000);
            data.Datum = new Date().toISOString().split('T')[0];

            let extraAnteckningar = [];
            if (data.AllmanStatus) extraAnteckningar.push(data.AllmanStatus);
            if (data.Anteckningar) extraAnteckningar.push(data.Anteckningar);
            data.Anteckningar = extraAnteckningar.join(' - ');
            delete data.AllmanStatus;

            await skickaDataTillMolnet("Skotsel", data, "historik.html");
        });

        init();
    </script>
</body>
</html>
