<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Varroastatus & Hälsa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Generera gemensam header med brödsmulor och info-knapp -->
    <script src="header.js"></script>
    <script>
        // Info-knappen inbakad i brödsmulorna
        let breadcrumbs = '<div style="display: flex; align-items: center; gap: 0.4rem;"><a href="index.html" style="color: white; text-decoration: none;">🏠 Hem</a><span> &gt; </span><span>Varroa</span></div><button class="info-btn" onclick="oppnaInfoModal()" title="Om sidan">i</button>';

        // Informationstext till modalen som genereras av header.js
        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Denna vy sammanställer hälsoläget och varroakontrollen för dina bigårdar och samhällen baserat på de senaste skötselanteckningarna.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Senaste prov / Nedfall:</strong> Visar det senaste registrerade värdet för naturligt nedfall eller provtagning i samhället.</li>
                <li><strong>Behandling & Karenstid:</strong> Ger en överblick över senast använda läkemedel och håller koll på eventuella aktiva karenstider innan honungsskörd.</li>
                <li><strong>Status:</strong> Visar tydligt om samhället har en pågående karenstid (⚠️) eller är klart för skörd/normal skötsel (✅).</li>
            </ul>
        `;

        laddaHeader("🔬 Varroastatus & Hälsa", breadcrumbs, "Om Varroastatus & Hälsa", infoInnehall);
    </script>

    <div class="container" style="max-width: 1000px; margin: 20px auto; padding: 0 15px;">

        <div class="card">
            <h3 style="margin-top: 0; color: #2c3e50;">Sammanställning per samhälle</h3>
            <p style="color: #666; font-size: 0.9rem;">
                Här ser du en överblick över senaste provtagningen, genomförda behandlingar samt eventuella aktiva karenstider innan honungsskörd.
            </p>

            <div style="overflow-x: auto;">
                <table class="varroa-table">
                    <thead>
                        <tr>
                            <th>Bigård</th>
                            <th>Samhälle</th>
                            <th>Senaste prov / Nedfall</th>
                            <th>Senaste behandling</th>
                            <th>Karenstid till</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="varroa-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #777;">Laddar varroadata...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        function hamtaVarroaData() {
            if (!WEB_APP_URL) {
                document.getElementById('varroa-tbody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Ingen anslutningslänk hittad.</td></tr>';
                return;
            }

            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");

            if (cachedData) {
                try {
                    let data = JSON.parse(cachedData);
                    bearbetaOchVisaVarroa(data.skotsel || [], data.samhallen || [], data.bigardar || []);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            }

            if (navigator.onLine) {
                fetch(WEB_APP_URL)
                    .then(res => res.json())
                    .then(data => {
                        sessionStorage.setItem("myBeeApp_globalData", JSON.stringify(data));
                        bearbetaOchVisaVarroa(data.skotsel || [], data.samhallen || [], data.bigardar || []);
                    })
                    .catch(error => {
                        console.error("Kunde inte hämta data:", error);
                        if (!cachedData) {
                            document.getElementById('varroa-tbody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Kunde inte läsa data från molnet.</td></tr>';
                        }
                    });
            }
        }

        function bearbetaOchVisaVarroa(skotselLista, samhalleLista, bigardLista) {
            const tbody = document.getElementById('varroa-tbody');
            tbody.innerHTML = '';

            if (!skotselLista || skotselLista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #777;">Inga skötselanteckningar registrerade än.</td></tr>';
                return;
            }

            let samhalleNamnMap = {};
            if (Array.isArray(samhalleLista)) {
                samhalleLista.forEach(s => {
                    let id = s.SamhallsID || s.SamhällsID || s.ID || "";
                    let namn = s.Kupbenamning || s.SamhallsNamn || s.Namn || s.Benamning || "";
                    if (id) {
                        samhalleNamnMap[id] = namn || id;
                    }
                });
            }

            let bigardNamnMap = {};
            if (Array.isArray(bigardLista)) {
                bigardLista.forEach(b => {
                    let id = b.BigardsID || b.ID;
                    let namn = b.BigardsNamn || b.Namn || b.Benamning || id;
                    if (id) bigardNamnMap[id] = namn;
                });
            }

            let samhalleStatus = {};

            skotselLista.forEach(item => {
                const id = item.SamhallsID || item.Samhälle || item.SamhällsID || "Okänt";
                if (!samhalleStatus[id] || new Date(item.Datum) > new Date(samhalleStatus[id].Datum)) {
                    samhalleStatus[id] = item;
                }
            });

            const IDag = new Date();

            Object.values(samhalleStatus).forEach(s => {
                let samhallsIdKey = s.SamhallsID || s.Samhälle || s.SamhällsID || "";
                let bigardsIdKey = s.BigardsID || s.Bigård || "";

                let samhallsNamn = samhalleNamnMap[samhallsIdKey] || s.SamhallsNamn || samhallsIdKey || '-';
                let bigardsNamn = bigardNamnMap[bigardsIdKey] || s.BigardsNamn || s.Bigard || '-';

                let karenstidSlut = s.Karenstid || s.KarenstidsDatum || "";
                let harAktivKarenstid = false;

                if (karenstidSlut) {
                    const slutDatum = new Date(karenstidSlut);
                    if (slutDatum >= IDag) {
                        harAktivKarenstid = true;
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td><strong>${bigardsNamn}</strong></td>
                <td>${samhallsNamn}</td>
                <td>${s.Kvalsternedfall || s.VarroaNedfall || 'Ej loggat'}</td>
                <td>${s.Lakemedel || s.Behandling || 'Ingen angiven'}</td>
                <td>${karenstidSlut || 'Ingen'}</td>
                <td>
                ${harAktivKarenstid
                ? '<span class="status-badge karenstid-aktiv">⚠️ Aktiv karenstid</span>': '<span class="status-badge karenstid-ok">✅ OK / Ingen karenstid</span>'}
                </td>
                `;
                tbody.appendChild(tr);
            });
        }

        hamtaVarroaData();
    </script>

</body>
</html>
