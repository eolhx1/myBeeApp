<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Kupa & Historik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header -->
    <script src="header.js"></script>
    <script>
        laddaHeader("📈 Historik & Trender", '<a href="index.html">🏠 Hem</a><span> &gt; </span><span>Historik</span>');
    </script>

    <div class="container">
        <!-- Steg 1: Välj bigård -->
        <div class="card">
            <h3>Steg 1: Välj bigård</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="valt-bigard-historia">Bigård:</label>
                <select id="valt-bigard-historia" name="BigardsID" autocomplete="off">
                    <option value="">Laddar bigårdar...</option>
                </select>
            </div>
        </div>

        <!-- Bigårdsinformation & Historik (visas när bigård är vald) -->
        <div class="card" id="bigard-info-card" style="display: none;">
            <h3>🏡 Om bigården</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 0.8rem;">
                <div style="background: #f8f9f9; padding: 0.6rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.75rem; color: #7f8c8d; display: block;">Typ</span>
                    <strong id="info-typ" style="font-size: 0.95rem; color: #2c3e50;">-</strong>
                </div>
                <div style="background: #f8f9f9; padding: 0.6rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.75rem; color: #7f8c8d; display: block;">Status</span>
                    <strong id="info-status" style="font-size: 0.95rem; color: #2c3e50;">-</strong>
                </div>
                <div style="background: #f8f9f9; padding: 0.6rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.75rem; color: #7f8c8d; display: block;">Etablerad</span>
                    <strong id="info-datum" style="font-size: 0.95rem; color: #2c3e50;">-</strong>
                </div>
            </div>
            <div id="info-anteckningar-wrapper" style="font-size: 0.9rem; color: #555; background: #fdfefe; padding: 0.6rem; border-radius: 6px; border: 1px dashed #d5dbdb; display: none;">
                <strong>Anteckningar:</strong> <span id="info-anteckningar"></span>
            </div>
        </div>

        <!-- Steg 2: Välj kupa (dold tills bigård är vald) -->
        <div class="card" id="steg2-card" style="display: none;">
            <h3>Steg 2: Välj kupa</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="valt-samhalle-historia">Samhälle / Kupa i bigården:</label>
                <select id="valt-samhalle-historia" name="SamhallsID">
                    <option value="">-- Välj kupa --</option>
                </select>
            </div>
        </div>

        <!-- Snabb-statistik / Nyckeltal -->
        <div class="card" id="statistik-card" style="display: none;">
            <h3>📊 Sammanställning för kupa</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; text-align: center;">
                <div style="background: #f8f9f9; padding: 0.8rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.8rem; color: #7f8c8d; display: block;">Besök i år</span>
                    <strong id="stat-besok" style="font-size: 1.2rem; color: #2c3e50;">0</strong>
                </div>
                <div style="background: #f8f9f9; padding: 0.8rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.8rem; color: #7f8c8d; display: block;">Total skörd</span>
                    <strong id="stat-skord" style="font-size: 1.2rem; color: #e67e22;">0 kg</strong>
                </div>
                <div style="background: #f8f9f9; padding: 0.8rem; border-radius: 6px; border: 1px solid #e5e7e9;">
                    <span style="font-size: 0.8rem; color: #7f8c8d; display: block;">Drottning år</span>
                    <strong id="stat-drottning" style="font-size: 1.2rem; color: #2980b9;">-</strong>
                </div>
            </div>
        </div>

        <!-- Kronologisk tidslinje -->
        <div class="card">
            <h3>Tidslinje & Händelsehistorik</h3>
            <div id="tidslinje-lista">
                <p>Välj bigård och kupa ovan för att se historik.</p>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        async function init() {
            if (!WEB_APP_URL) {
                window.location.href = "index.html";
                return;
            }

            let allData = null;
            let cachedData = sessionStorage.getItem("myBeeApp_allData");

            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    fyllBigardarDropdown(allData);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            } else {
                document.getElementById('tidslinje-lista').innerHTML = "<p>Laddar data från molnet...</p>";
            }

            try {
                let response = await fetch(WEB_APP_URL);
                allData = await response.json();
                sessionStorage.setItem("myBeeApp_allData", JSON.stringify(allData));
                fyllBigardarDropdown(allData);
            } catch (error) {
                console.error("Fel vid laddning:", error);
                if (!cachedData) {
                    document.getElementById('tidslinje-lista').innerHTML = "<p>Kunde inte ladda data.</p>";
                }
            }
        }

        function fyllBigardarDropdown(data) {
            let bigårdar = data.bigardar || [];
            let bigardSelect = document.getElementById('valt-bigard-historia');
            
            bigardSelect.innerHTML = '<option value="">-- Välj bigård --</option>';

            if (bigårdar.length === 0) {
                bigardSelect.innerHTML = '<option value="">Inga bigårdar inlagda</option>';
                return;
            }

            bigårdar.forEach(b => {
                let opt = document.createElement('option');
                // Tvinga trim på ID och namn för att undvika strul med dolda mellanslag
                opt.value = String(b.BigardsID || "").trim();
                opt.textContent = String(b.Namn || "").trim();
                bigardSelect.appendChild(opt);
            });

            let valtBigardID = sessionStorage.getItem("myBeeApp_valdBigardHistoria");
            if (valtBigardID && bigårdar.some(b => String(b.BigardsID || "").trim() === String(valtBigardID).trim())) {
                bigardSelect.value = valtBigardID.trim();
            } else {
                bigardSelect.value = "";
            }

            uppdateraKuporDropdown(data);
        }

        function tommFaltOchStatistik() {
            document.getElementById('bigard-info-card').style.display = 'none';
            document.getElementById('steg2-card').style.display = 'none';
            document.getElementById('statistik-card').style.display = 'none';
            document.getElementById('valt-samhalle-historia').innerHTML = '<option value="">-- Välj kupa --</option>';
            document.getElementById('tidslinje-lista').innerHTML = '<p>Välj bigård och kupa ovan för att se historik.</p>';
        }

        function uppdateraKuporDropdown(dataProvided = null) {
            const valtBigardsID = document.getElementById('valt-bigard-historia').value.trim();
            sessionStorage.setItem("myBeeApp_valdBigardHistoria", valtBigardsID);

            let allData = dataProvided;
            if (!allData) {
                let cachedData = sessionStorage.getItem("myBeeApp_allData");
                if (cachedData) allData = JSON.parse(cachedData);
            }

            let steg2Card = document.getElementById('steg2-card');
            let infoCard = document.getElementById('bigard-info-card');
            let samhalleSelect = document.getElementById('valt-samhalle-historia');

            if (!valtBigardsID || !allData) {
                tommFaltOchStatistik();
                return;
            }

            let allaBigårdar = allData.bigardar || [];
            let valdBigardObjekt = allaBigårdar.find(b => String(b.BigardsID || "").trim() === valtBigardsID);

            if (valdBigardObjekt) {
                document.getElementById('info-typ').textContent = valdBigardObjekt.Typ || '-';
                document.getElementById('info-status').textContent = valdBigardObjekt.Status || 'Aktiv';
                document.getElementById('info-datum').textContent = valdBigardObjekt.Etableringsdatum ? valdBigardObjekt.Etableringsdatum.split('T')[0] : '-';
                
                let anteckningarWrapper = document.getElementById('info-anteckningar-wrapper');
                let anteckningarSpan = document.getElementById('info-anteckningar');
                if (valdBigardObjekt.Anteckningar && valdBigardObjekt.Anteckningar.trim() !== "") {
                    anteckningarSpan.textContent = valdBigardObjekt.Anteckningar;
                    anteckningarWrapper.style.display = 'block';
                } else {
                    anteckningarWrapper.style.display = 'none';
                }

                infoCard.style.display = 'block';
            } else {
                infoCard.style.display = 'none';
            }

            let allaSamhällen = allData.samhallen || [];
            let minaSamhällen = allaSamhällen.filter(s => String(s.BigardsID || "").trim() === valtBigardsID);

            samhalleSelect.innerHTML = '<option value="">-- Välj kupa --</option>';

            if (minaSamhällen.length === 0) {
                samhalleSelect.innerHTML = '<option value="">Inga samhällen i denna bigård</option>';
                steg2Card.style.display = 'block';
                document.getElementById('statistik-card').style.display = 'none';
                document.getElementById('tidslinje-lista').innerHTML = '<p>Inga kupor finns i denna bigård.</p>';
                return;
            }

            minaSamhällen.forEach(s => {
                let opt = document.createElement('option');
                opt.value = String(s.SamhallsID || "").trim();
                opt.textContent = `${s.Kupbenamning || 'Kupa'} ${s.DrottningAr ? `(Drottning år: ${s.DrottningAr})` : ''}`;
                samhalleSelect.appendChild(opt);
            });

            steg2Card.style.display = 'block';

            let valtSamhallsID = sessionStorage.getItem("myBeeApp_valdKupaHistoria");
            if (valtSamhallsID) {
                let finnsKupan = minaSamhällen.some(s => String(s.SamhallsID || "").trim() === String(valtSamhallsID).trim());
                if (finnsKupan) {
                    samhalleSelect.value = valtSamhallsID.trim();
                    visaHistorikForKupa(allData);
                } else {
                    sessionStorage.removeItem("myBeeApp_valdKupaHistoria");
                    document.getElementById('statistik-card').style.display = 'none';
                    document.getElementById('tidslinje-lista').innerHTML = '<p>Välj en kupa ovan för att se historik.</p>';
                }
            } else {
                document.getElementById('statistik-card').style.display = 'none';
                document.getElementById('tidslinje-lista').innerHTML = '<p>Välj en kupa ovan för att se historik.</p>';
            }
        }

        function visaHistorikForKupa(dataProvided = null) {
            const valtSamhallsID = document.getElementById('valt-samhalle-historia').value.trim();
            sessionStorage.setItem("myBeeApp_valdKupaHistoria", valtSamhallsID);

            let allData = dataProvided;
            if (!allData) {
                let cachedData = sessionStorage.getItem("myBeeApp_allData");
                if (cachedData) allData = JSON.parse(cachedData);
            }

            if (!allData || !valtSamhallsID) {
                document.getElementById('statistik-card').style.display = 'none';
                document.getElementById('tidslinje-lista').innerHTML = '<p>Välj en kupa ovan för att se historik.</p>';
                return;
            }

            let allaSamhällen = allData.samhallen || [];
            let skotselLoggar = allData.skotsel || [];

            let aktivKupa = allaSamhällen.find(s => String(s.SamhallsID || "").trim() === valtSamhallsID);
            let minaLoggar = skotselLoggar.filter(s => String(s.BigardsID || "").trim() === document.getElementById('valt-bigard-historia').value.trim() && String(s.SamhallsID || "").trim() === valtSamhallsID);
            // (Om du vill filtrera rent på SamhallsID räcker oftast s.SamhallsID)
            if (minaLoggar.length === 0) {
                minaLoggar = skotselLoggar.filter(s => String(s.SamhallsID || "").trim() === valtSamhallsID);
            }

            minaLoggar.sort((a, b) => new Date(b.Datum) - new Date(a.Datum));

            let antalBesök = minaLoggar.length;
            document.getElementById('stat-besok').textContent = antalBesök;
            document.getElementById('stat-drottning').textContent = aktivKupa && aktivKupa.DrottningAr ? aktivKupa.DrottningAr : "-";

            let totalSkördKilo = 0;
            minaLoggar.forEach(l => {
                if (l.SkattadMangd) {
                    let matchNummer = l.SkattadMangd.match(/\d+/);
                    if (matchNummer) {
                        totalSkördKilo += parseInt(matchNummer[0]);
                    }
                }
            });
            document.getElementById('stat-skord').textContent = totalSkördKilo > 0 ? `${totalSkördKilo} kg` : "0 kg";
            document.getElementById('statistik-card').style.display = 'block';

            let tidslinjeDiv = document.getElementById('tidslinje-lista');
            tidslinjeDiv.innerHTML = "";

            if (minaLoggar.length === 0) {
                tidslinjeDiv.innerHTML = "<p>Inga sparade besök registrerade för denna kupa ännu.</p>";
                return;
            }

            minaLoggar.forEach(logg => {
                let kortDatum = logg.Datum ? logg.Datum.substring(0, 10) : "";
                let drottningText = logg.Drottningsett || logg.Drottning || "Ej angivet";
                let svarmText = logg.Svarmlystnad || "Ej angivet";
                let tempText = logg.Temperament || "Ej angivet";

                let extraInfoHTML = "";
                if (logg.Lakemedel) {
                    extraInfoHTML += `<p style="color: #d35400; margin: 0.3rem 0;">💊 <strong>Läkemedel:</strong> ${logg.Lakemedel} (${logg.Diagnos || 'Behandling'}) - Mängd: ${logg.Mangd || '-'}</p>`;
                }
                if (logg.Kvalsternedfall) {
                    extraInfoHTML += `<p style="margin: 0.3rem 0;">🔬 <strong>Varroanedfall:</strong> ${logg.Kvalsternedfall} st</p>`;
                }
                if (logg.Sjukdomskontroll) {
                    extraInfoHTML += `<p style="margin: 0.3rem 0;">📋 <strong>Sjukdomskontroll:</strong> ${logg.Sjukdomskontroll}</p>`;
                }
                if (logg.SkattadMangd) {
                    extraInfoHTML += `<p style="color: #e67e22; margin: 0.3rem 0;">🍯 <strong>Skörd:</strong> ${logg.SkattadMangd}</p>`;
                }

                let item = document.createElement('div');
                item.className = 'log-item';
                item.style.borderLeftColor = '#27ae60';
                item.innerHTML = `
                    <p style="margin-top: 0;"><strong>📅 ${kortDatum}</strong> ${logg.Tid ? `kl ${logg.Tid}` : ''}</p>
                    <p>👑 ${drottningText}</p>
                    <p>🐝 Svärmlystnad: ${svarmText} | Humör: ${tempText}</p>
                    ${logg.Anteckningar ? `<p><em>"${logg.Anteckningar}"</em></p>` : ''}
                    ${extraInfoHTML}
                `;
                tidslinjeDiv.appendChild(item);
            });
        }

        document.getElementById('valt-bigard-historia').addEventListener('change', () => {
            sessionStorage.removeItem("myBeeApp_valdKupaHistoria");
            tommFaltOchStatistik();
            uppdateraKuporDropdown(null);
        });
        
        document.getElementById('valt-samhalle-historia').addEventListener('change', () => visaHistorikForKupa(null));

        init();
    </script>
</body>
</html>
