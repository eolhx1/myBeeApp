<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Mina Bigårdar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="style.css">


</head>
<body>

    <header>
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <ul id="dropdownMenu" class="dropdown-menu">
                <li><a href="#" onclick="visaInstallningar()">Ändra anslutningslänk</a></li>
                <li><a href="ny-bigard.html">Lägg till ny bigård</a></li>
            </ul>
        </div>
        <div class="header-title">🐝 MyBeeApp - Bigårdar</div>
        <div style="width: 24px;"></div>
    </header>

    <div class="container">
        <!-- Setup om URL saknas -->
        <div id="setup-screen" style="display: none;">
            <h2>Anslut din app</h2>
            <p>Klistra in din Google Apps Script Web App URL nedan:</p>
            <input type="text" id="url-input" placeholder="https://script.google.com/macros/s/.../exec">
            <button onclick="sparaUrl()">Anslut</button>
        </div>

        <!-- Huvudinnehåll -->
        <div id="main-content" style="display: none;">
            <h3>Karta över bigårdar</h3>
            <div id="map"></div>

            <h3>Mina bigårdar (Lista)</h3>
            <div id="bigard-list">
                <p>Laddar bigårdar...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;

        function toggleMenu() {
            const menu = document.getElementById("dropdownMenu");
            menu.classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn') && !event.target.closest('.menu-container')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function visaInstallningar() {
            localStorage.removeItem("myBeeApp_url");
            initApp();
        }

        function initApp() {
            const savedUrl = localStorage.getItem("myBeeApp_url");
            if (!savedUrl) {
                document.getElementById("setup-screen").style.display = "block";
                document.getElementById("main-content").style.display = "none";
            } else {
                document.getElementById("setup-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                
                if (!map && typeof L !== 'undefined') {
                    map = L.map('map').setView([62.0, 15.0], 4);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);
                }

                hamtaBigardar();
            }
        }

        function sparaUrl() {
            const url = document.getElementById("url-input").value.trim();
            if (url.startsWith("https://script.google.com")) {
                localStorage.setItem("myBeeApp_url", url);
                initApp();
            } else {
                alert("Ange en giltig Apps Script URL.");
            }
        }

        async function hamtaBigardar() {
            const WEB_APP_URL = localStorage.getItem("myBeeApp_url");
            const listContainer = document.getElementById("bigard-list");

            try {
                let response = await fetch(`${WEB_APP_URL}?sheet=Bigardar`);
                let data = await response.json();

                if (data.status === "error") {
                    listContainer.innerHTML = `<p style="color:red;">Fel: ${data.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    listContainer.innerHTML = "<p>Inga bigårdar tillagda ännu.</p>";
                    return;
                }

                listContainer.innerHTML = "";
                
                if (map) {
                    map.invalidateSize();
                }

                data.forEach(b => {
                    const status = b.Status || "Aktiv";
                    const isInaktiv = status === "Inaktiv" || status.includes("Inaktiv");
                    
                    const card = document.createElement("div");
                    card.className = `card ${isInaktiv ? 'inaktiv' : ''}`;
                    card.onclick = () => {
                        window.location.href = `ny-bigard.html?id=${encodeURIComponent(b.BigardsID)}`;
                    };

                    card.innerHTML = `
                        <h3>${b.Namn || 'Namnlös bigård'}</h3>
                        <p><strong>Typ:</strong> ${b.Typ || '-'}</p>
                        <p><strong>Samhällen:</strong> ${b.AntalSamhallen || 0}</p>
                        <span class="badge ${isInaktiv ? 'inaktiv' : ''}">${status}</span>
                    `;
                    listContainer.appendChild(card);

                    if (map && b.Latitud && b.Longitud) {
                        let lat = parseFloat(b.Latitud.toString().replace(',', '.'));
                        let lon = parseFloat(b.Longitud.toString().replace(',', '.'));
                        if (!isNaN(lat) && !isNaN(lon)) {
                            L.marker([lat, lon]).addTo(map)
                                .bindPopup(`<b>${b.Namn}</b><br>${b.Typ}`);
                        }
                    }
                });

            } catch (error) {
                console.error(error);
                listContainer.innerHTML = "<p style='color:red;'>Kunde inte hämta data från servern.</p>";
            }
        }

        initApp();
    </script>
</body>
</html>
