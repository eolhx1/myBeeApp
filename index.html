<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>MyBeeApp</title>
</head>
<body>

    <div id="bigardar-lista">Laddar bigårdar...</div>

    <script>
        // Din fasta, permanenta Apps Script-länk är inlagd här:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOmE9c8y8bNdNmBmf1V7tWVuR1aJQfxjhwwDDAFu1oWSeQQx29VHHue2jcziql9ltK/exec";

        // Funktion för att hämta kalkylarks-ID från localStorage eller extrahera det om man klistrat in hela länk-adressen
        function getSpreadsheetId() {
            let stored = localStorage.getItem("myBeeApp_sheetId");
            if (!stored) return "";
            
            if (stored.includes("docs.google.com")) {
                let match = stored.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    return match[1];
                }
            }
            return stored;
        }

        // 1. HÄMTA ALL DATA
        function fetchData() {
            const sheetId = getSpreadsheetId();
            
            if (!sheetId) {
                const listaDiv = document.getElementById("bigardar-lista");
                if (listaDiv) {
                    listaDiv.innerHTML = "Inget kalkylarks-ID hittades. Ange ditt kalkylarks-ID/länk i appens inställningar.";
                }
                return;
            }

            fetch(`${SCRIPT_URL}?id=${sheetId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error("Fel från Apps Script:", data.error);
                        return;
                    }
                    uppdateraBigardsLista(data.bigardar);
                })
                .catch(error => {
                    console.error("Kunde inte hämta data:", error);
                });
        }

        // 2. SPARA NY DATA
        function saveData(sheetName, rowData) {
            const sheetId = getSpreadsheetId();
            
            if (!sheetId) {
                alert("Inget kalkylarks-ID är inställt!");
                return;
            }

            fetch(`${SCRIPT_URL}?sheet=${sheetName}&id=${sheetId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(rowData)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    fetchData();
                } else {
                    console.error("Kunde inte spara:", result.message);
                }
            })
            .catch(error => {
                console.error("Fel vid sparande:", error);
            });
        }

        // 3. SPARA ANVÄNDARENS ID/LÄNK VIA GRÄNSSNITTET
        function sparaAnvandarId(inputVardde) {
            if (!inputVardde) return;
            localStorage.setItem("myBeeApp_sheetId", inputVardde.trim());
            alert("Kalkylarks-koppling sparad!");
            fetchData();
        }

        // Fyll gränssnittet
        function uppdateraBigardsLista(bigardar) {
            const listaDiv = document.getElementById("bigardar-lista");
            if (!listaDiv) return;
            
            if (!bigardar || bigardar.length === 0) {
                listaDiv.innerHTML = "Inga bigårdar hittades i kalkylarket.";
                return;
            }
            
            let html = "<ul>";
            bigardar.forEach(b => {
                html += `<li>${b.Namn || "Namnlös bigård"} (Lat: ${b.Latitud || "-"}, Lon: ${b.Longitud || "-"})</li>`;
            });
            html += "</ul>";
            
            listaDiv.innerHTML = html;
        }

        // Kör automatiskt när sidan laddas
        window.onload = function() {
            fetchData();
        };
    </script>
</body>
</html>
