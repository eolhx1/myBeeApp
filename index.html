<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .settings-box { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Enkelt inställningsfält för plattan -->
    <div class="settings-box">
        <h3>Inställningar</h3>
        <label for="sheetInput">Klistra in länk eller ID till ditt Google Kalkylark:</label>
        <input type="text" id="sheetInput" placeholder="https://docs.google.com/spreadsheets/d/...">
        <button onclick="sparaFranFalt()">Spara koppling</button>
    </div>

    <h2>Mina Bigårdar</h2>
    <div id="bigardar-lista">Laddar bigårdar...</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOmE9c8y8bNdNmBmf1V7tWVuR1aJQfxjhwwDDAFu1oWSeQQx29VHHue2jcziql9ltK/exec";

        function getSpreadsheetId() {
            let stored = localStorage.getItem("myBeeApp_sheetId");
            if (!stored) return "";
            
            if (stored.includes("docs.google.com")) {
                let match = stored.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    return match[1];
                }
            }
            return stored;
        }

        function fetchData() {
            const sheetId = getSpreadsheetId();
            
            if (!sheetId) {
                const listaDiv = document.getElementById("bigardar-lista");
                if (listaDiv) {
                    listaDiv.innerHTML = "Inget kalkylarks-ID hittades. Ange ditt kalkylarks-ID/länk i fältet ovan.";
                }
                return;
            }

            fetch(`${SCRIPT_URL}?id=${sheetId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error("Fel från Apps Script:", data.error);
                        document.getElementById("bigardar-lista").innerHTML = "Fel: " + data.error;
                        return;
                    }
                    uppdateraBigardsLista(data.bigardar);
                })
                .catch(error => {
                    console.error("Kunde inte hämta data:", error);
                });
        }

        function sparaFranFalt() {
            const inputVardde = document.getElementById("sheetInput").value;
            if (!inputVardde) {
                alert("Fältet är tomt!");
                return;
            }
            localStorage.setItem("myBeeApp_sheetId", inputVardde.trim());
            alert("Kalkylarks-koppling sparad!");
            fetchData();
        }

        function uppdateraBigardsLista(bigardar) {
            const listaDiv = document.getElementById("bigardar-lista");
            if (!listaDiv) return;
            
            if (!bigardar || bigardar.length === 0) {
                listaDiv.innerHTML = "Inga bigårdar hittades i kalkylarket.";
                return;
            }
            
            let html = "<ul>";
            bigardar.forEach(b => {
                html += `<li>${b.Namn || "Namnlös bigård"} (Lat: ${b.Latitud || "-"}, Lon: ${b.Longitud || "-"})</li>`;
            });
            html += "</ul>";
            
            listaDiv.innerHTML = html;
        }

        window.onload = function() {
            // Fyll i fältet automatiskt om det redan finns sparat
            let savedId = localStorage.getItem("myBeeApp_sheetId");
            if (savedId) {
                document.getElementById("sheetInput").value = savedId;
            }
            fetchData();
        };
    </script>
</body>
</html>
