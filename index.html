<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Mina Bigårdar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="style.css">


</head>
<body>

    <header>
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <ul id="dropdownMenu" class="dropdown-menu">
                <li><a href="#" onclick="visaInstallningar()">Ändra anslutningslänk</a></li>
                <li><a href="ny-bigard.html">Lägg till ny bigård</a></li>
            </ul>
        </div>
        <div class="header-title">🐝 MyBeeApp - Bigårdar</div>
        <div style="width: 24px;"></div>
    </header>

    <div class="container">
        <!-- Setup om URL saknas -->
        <div id="setup-screen" style="display: none;">
            <h2>Anslut din app</h2>
            <p>Klistra in din Google Apps Script Web App URL nedan:</p>
            <input type="text" id="url-input" placeholder="https://script.google.com/macros/s/.../exec">
            <button onclick="sparaUrl()">Anslut</button>
        </div>

        <!-- Huvudinnehåll -->
        <div id="main-content" style="display: none;">
            <h3>Karta över bigårdar</h3>
            <div id="map"></div>

            <h3>Mina bigårdar (Lista)</h3>
            <div id="bigard-list">
                <p>Laddar bigårdar...</p>
            </div>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;

        function toggleMenu() {
            const menu = document.getElementById("dropdownMenu");
            menu.classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn') && !event.target.closest('.menu-container')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function visaInstallningar() {
            localStorage.removeItem("myBeeApp_url");
            sessionStorage.removeItem("myBeeApp_bigardar");
            initApp();
        }

        function initApp() {
            const savedUrl = localStorage.getItem("myBeeApp_url");
            if (!savedUrl) {
                document.getElementById("setup-screen").style.display = "block";
                document.getElementById("main-content").style.display = "none";
            } else {
                document.getElementById("setup-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                
                if (!map && typeof L !== 'undefined') {
                    map = L.map('map').setView([62.0, 15.0], 4);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);
                }

                // Kolla om vi har sparad data i sessionen först för direkt visning
                const cachedBigardar = sessionStorage.getItem("myBeeApp_bigardar");
                if (cachedBigardar) {
                    try {
                        let data = JSON.parse(cachedBigardar);
                        visaBigardar(data);
                    } catch (e) {
                        console.error("Kunde inte läsa cache", e);
                    }
                }

                // Hämta alltid färsk data i bakgrunden (eller direkt om ingen cache fanns)
                hamtaBigardar(!cachedBigardar);
            }
        }

        function sparaUrl() {
            const url = document.getElementById("url-input").value.trim();
            if (url.startsWith("https://script.google.com")) {
                localStorage.setItem("myBeeApp_url", url);
                initApp();
            } else {
                alert("Ange en giltig Apps Script URL.");
            }
        }

        async function hamtaBigardar(visaLaddarText = false) {
            const WEB_APP_URL = localStorage.getItem("myBeeApp_url");
            const listContainer = document.getElementById("bigard-list");

            if (visaLaddarText && !sessionStorage.getItem("myBeeApp_bigardar")) {
                listContainer.innerHTML = "<p>Laddar bigårdar...</p>";
            }

            try {
                let response = await fetch(`${WEB_APP_URL}?sheet=Bigardar`);
                let data = await response.json();

                if (data.status === "error") {
                    if (!sessionStorage.getItem("myBeeApp_bigardar")) {
                        listContainer.innerHTML = `<p style="color:red;">Fel: ${data.message}</p>`;
                    }
                    return;
                }

                if (!data || data.length === 0) {
                    listContainer.innerHTML = "<p>Inga bigårdar tillagda ännu.</p>";
                    sessionStorage.removeItem("myBeeApp_bigardar");
                    return;
                }

                // Spara ner i cachen
                sessionStorage.setItem("myBeeApp_bigardar", JSON.stringify(data));

                // Rita ut listan och kartan med nya datan
                visaBigardar(data);

            } catch (error) {
                console.error(error);
                if (!sessionStorage.getItem("myBeeApp_bigardar")) {
                    listContainer.innerHTML = "<p style='color:red;'>Kunde inte hämta data från servern.</p>";
                }
            }
        }

                function visaBigardar(data) {
            const listContainer = document.getElementById("bigard-list");
            listContainer.innerHTML = "";
            
            if (map) {
                map.invalidateSize();
            }

            data.forEach(b => {
                const status = b.Status || "Aktiv";
                const isInaktiv = status === "Inaktiv" || status.includes("Inaktiv");
                
                const card = document.createElement("div");
                card.className = `card ${isInaktiv ? 'inaktiv' : ''}`;
                
                // HUVUDKLICK: Tar dig direkt till skötselsidan för denna bigård (så som en biodlare jobbar)
                card.onclick = () => {
                    window.location.href = `skotsel.html?id=${encodeURIComponent(b.BigardsID)}`;
                };

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3>${b.Namn || 'Namnlös bigård'}</h3>
                            <p><strong>Typ:</strong> ${b.Typ || '-'}</p>
                            <p><strong>Samhällen:</strong> ${b.AntalSamhallen || 0}</p>
                            <span class="badge ${isInaktiv ? 'inaktiv' : ''}">${status}</span>
                        </div>
                        <button onclick="event.stopPropagation(); redigeraBigard('${b.BigardsID}');" title="Ändra bigård" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.5rem;" aria-label="Ändra bigård">⚙️</button>
                    </div>
                `;
                listContainer.appendChild(card);

                if (map && b.Latitud && b.Longitud) {
                    let lat = parseFloat(b.Latitud.toString().replace(',', '.'));
                    let lon = parseFloat(b.Longitud.toString().replace(',', '.'));
                    if (!isNaN(lat) && !isNaN(lon)) {
                        L.marker([lat, lon]).addTo(map)
                            .bindPopup(`<b>${b.Namn}</b><br>${b.Typ}<br><a href="skotsel.html?id=${encodeURIComponent(b.BigardsID)}">Öppna skötselkort</a>`);
                    }
                }
            });
        }

        // Hjälpfunktion för att nå inställningar/formuläret för bigården via kugghjulet
        function redigeraBigard(id) {
            window.location.href = `ny-bigard.html?id=${id}`;
        }


        initApp();
    </script>

</body>
</html>
