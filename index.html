<!-- Filnamn: index.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Översikt</title>
    <link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <!-- Gemensamma skript -->
<script src="header.js"></script>
<script src="api.js"></script>
<script src="utils.js"></script>

    <script>
        // Informationstext till modalen som skapas automatiskt av header.js
const titel = "🏠 Hem / Karta";
const infoRubrik = "Om översikten";

        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Detta är appens startsida och översikt över dina platser och bigårdar.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Kartan:</strong> Visar en geografisk översikt av dina aktiva (och inaktiva) bigårdar. Klicka på en markör för snabblänk.</li>
                <li><strong>Listan:</strong> Visar alla dina bigårdar som kort. Klicka på ett kort för att komma direkt till skötselkortet.</li>
                <li><strong>Statusknappar:</strong> Via knapparna på korten kan du nå snabbstatus eller ändra bigårdens uppgifter.</li>
            </ul>
        `;

        // Anropa laddaHeader med titel och info-innehåll (brödsmulor sköts nu helt automatiskt i header.js)
laddaHeader(
    titel,
    infoRubrik,
    infoInnehall
);
    </script>

    <div class="container">
        <!-- Banner för osynkad data -->
        <div id="offline-banner" onclick="synkaOfflineKoe()">
            ⚠️ Du har osynkad data som väntar på att skickas. Klicka här för att synka nu!
            <span id="offline-count" style="background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 12px; font-size: 0.9rem;">0 st</span>
        </div>

        <!-- Setup om URL saknas -->
        <div id="setup-screen" style="display: none;">
            <h2>Anslut din app</h2>
            <p>
                Klistra in din Google Apps Script Web App URL nedan:
            </p>
<input
    type="text"
    id="url-input"
    autocomplete="off"
    placeholder="https://script.google.com/macros/s/.../exec">
            <button onclick="sparaUrl()">Anslut</button>
        </div>

        <!-- Huvudinnehåll -->
        <div id="main-content" style="display: none;">
            <h3>Karta över bigårdar</h3>
            <div id="map"></div>

            <h3>Mina bigårdar (Lista)</h3>
            <div id="bigard-list">
                <p>
                    Laddar bigårdar...
                </p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="index.js"></script>
    
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => console.log('Service Worker registrerad!', reg))
                .catch((err) => console.log('Kunde inte registrera Service Worker:', err));
        });
    }
</script>

</body>
</html>
