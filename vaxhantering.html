<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Vaxhantering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="header.js"></script>
    <script>
        laddaHeader("🕯️ Vaxhantering", '<a href="index.html">🏠 Hem</a><span> &gt; </span><span>Vaxhantering</span>');
    </script>

    <div class="container">
        <form id="vax-form">
            <input type="hidden" id="vax-id" name="VaxID">

            <div class="form-group">
                <label for="datum">Datum:</label>
                <input type="date" id="datum" name="Datum" required>
            </div>

            <div class="form-group">
                <label for="typ">Händelsetyp:</label>
                <select id="typ" name="Typ">
                    <option value="Utsortering">Utsortering av gamla ramar</option>
                    <option value="Smältning">Smältning till råvax</option>
                    <option value="Inbyte">Inbyte mot färdiga vaxkakor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="antal-ramar">Antal ramar (om tillämpligt):</label>
                <input type="number" id="antal-ramar" name="AntalRamar" min="0" value="0">
            </div>

            <div class="form-group">
                <label for="vikt-kg">Vikt i kg (råvax eller kakor):</label>
                <input type="number" step="0.1" id="vikt-kg" name="ViktKg" min="0" value="0">
            </div>

            <div class="form-group">
                <label for="status">Status / Förvaring:</label>
                <select id="status" name="Status">
                    <option value="I lager (Förråd)">I lager (Förråd)</option>
                    <option value="Skickat till vaxfabrik">Skickat till vaxfabrik</option>
                    <option value="Kasserat / Skrotvax">Kasserat / Skrotvax</option>
                </select>
            </div>

            <div class="form-group">
                <label for="anteckningar">Anteckningar:</label>
                <textarea id="anteckningar" name="Anteckningar" placeholder="T.ex. 3/4 Langstroth-ramar, mörka vaxkakor från kupa 2..."></textarea>
            </div>

            <button type="submit" class="btn" id="submit-btn">Spara vaxhändelse</button>
        </form>

        <a href="index.html" class="back-link">← Tillbaka till översikten</a>
    </div>

    <script>
        document.getElementById('datum').valueAsDate = new Date();

        document.getElementById('vax-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const WEB_APP_URL = localStorage.getItem("myBeeApp_url");
            if (!WEB_APP_URL) {
                alert("Ingen anslutningslänk hittades.");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Sparar...";

            const currentId = document.getElementById('vax-id').value || ("V" + Math.floor(1000 + Math.random() * 9000));

            const formData = {
                VaxID: currentId,
                Datum: document.getElementById('datum').value,
                Typ: document.getElementById('typ').value,
                AntalRamar: document.getElementById('antal-ramar').value,
                ViktKg: document.getElementById('vikt-kg').value,
                Status: document.getElementById('status').value,
                Anteckningar: document.getElementById('anteckningar').value
            };

            try {
                let response = await fetch(`${WEB_APP_URL}?sheet=Vax`, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(formData)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    alert("Vaxhändelsen har sparats!");
                    window.location.href = "index.html";
                } else {
                    alert("Ett fel uppstod: " + (result.message || "Okänt fel"));
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Spara vaxhändelse";
                }
            } catch (error) {
                console.error("Fel:", error);
                alert("Kunde inte nå servern.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Spara vaxhändelse";
            }
        });
    </script>
</body>
</html>
