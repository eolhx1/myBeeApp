<!-- Filnamn: drottningar.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Drottningregister</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header och API -->
    <script src="header.js"></script>
    <script src="api.js"></script>
<script src="utils.js"></script>

    <script>
        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Här håller du ordning på alla bigårdens drottningar, deras härstamning, avelsvärden och ålder.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Registrera / Koppla:</strong> Fyll i uppgifter och koppla drottningen till ett specifikt samhälle/kupa.</li>
                <li><strong>Ålder & Färg:</strong> Appen beräknar ålder automatiskt.</li>
                <li><strong>Avelsvärden:</strong> Bedöm egenskaper som svärmtröghet, temperament och honungsprestanda.</li>
            </ul>
        `;

laddaHeader(
    "👑 Drottningregister",
    "Om Drottningregistret",
    infoInnehall
); </script>

    <div class="container">
        <!-- Lägg till ny drottning -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="margin: 0;">Registrera ny drottning</h3>
            </div>
            <form id="drottning-form">
                <div class="form-group">
                    <label for="namn">Drottningens namn / ID:</label>
                    <input type="text" id="namn" name="Namn" required placeholder="T.ex. Sinistra eller ID #1">
                </div>

                <div class="form-group">
                    <label for="samhalls-koppling">Koppla till kupa / samhälle:</label>
                    <select id="samhalls-koppling" name="SamhallsID">
                        <option value="">-- Välj kupa (valfritt) --</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="drottning-ar">Årgång (År):</label>
<input type="number" id="drottning-ar" name="DrottningAr">
                    </div>
                    <div class="form-group">
                        <label for="farg">Färgmarkering:</label>
                        <select id="farg" name="Farg">
                            <option value="Vit">Vit (år 2/7)</option>
                            <option value="Gul">Gul (år 3/8)</option>
                            <option value="Röd">Röd (år 4/9)</option>
                            <option value="Grön">Grön (år 5/0)</option>
                            <option value="Blå">Blå (år 1/6)</option>
                            <option value="Ej märkt">Ej märkt</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="ras">Ras / Härstamning:</label>
                        <input type="text" id="ras" name="Ras" placeholder="T.ex. Buckfast, Carnica">
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select id="status" name="Status">
                            <option value="Aktiv i kupa">Aktiv i kupa</option>
                            <option value="Avsatt">Avsatt</option>
                            <option value="Bytt">Bytt</option>
                            <option value="Förlorad">Förlorad</option>
                        </select>
                    </div>
                </div>

                <!-- Egenskaper & Avelsvärde -->
                <div style="margin: 1rem 0 0.5rem 0; border-top: 2px dashed #3498db; padding-top: 1rem;">
                    <h4 style="margin: 0 0 0.8rem 0; color: #2c3e50;">🧬 Egenskaper & Avelsvärde</h4>
                    
                    <div class="form-group">
                        <label for="svarmtroghet">Svärmtröghet:</label>
                        <select id="svarmtroghet" name="Svarmtroghet">
                            <option value="">-- Välj bedömning --</option>
                            <option value="Mycket svärmtrög">Mycket svärmtrög</option>
                            <option value="Normal">Normal</option>
                            <option value="Svärmbenägen">Svärmbenägen</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="temperament">Temperament / Humör:</label>
                        <select id="temperament" name="Temperament">
                            <option value="">-- Välj bedömning --</option>
                            <option value="Mycket lugna och snälla">Mycket lugna och snälla</option>
                            <option value="Normala">Normala</option>
                            <option value="Stickiga / Aggressiva">Stickiga / Aggressiva</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="honungsprestanda">Honungsprestanda:</label>
                        <select id="honungsprestanda" name="Honungsprestanda">
                            <option value="">-- Välj bedömning --</option>
                            <option value="Topprestanda (mycket drag)">Topprestanda (mycket drag)</option>
                            <option value="Medel">Medel</option>
                            <option value="Svag samlare">Svag samlare</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="yngelsattning">Yngelsättning:</label>
                        <select id="yngelsattning" name="Yngelsattning">
                            <option value="">-- Välj bedömning --</option>
                            <option value="Tät och fin (inga luckor)">Tät och fin (inga luckor)</option>
                            <option value="Normal">Normal</option>
                            <option value="Oregelbunden / Luckig">Oregelbunden / Luckig</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="anteckningar">Övriga anteckningar:</label>
                    <textarea id="anteckningar" name="Anteckningar" placeholder="T.ex. Inköpt från..."></textarea>
                </div>

                <button type="submit" class="btn" id="drottning-btn" style="background-color: #27ae60;">Spara drottning</button>
            </form>
        </div>

        <!-- Lista över befintliga drottningar -->
        <div class="card">
            <h3>Dina drottningar</h3>
            <div id="drottning-lista">
                <p>Laddar drottningar...</p>
            </div>
        </div>
    </div>

    <script>
document.getElementById('drottning-ar').value =
    new Date().getFullYear();	
		
        async function laddaDrottningarData() {
            let allData = await hamtaData();
            if (allData) {
                fyllDropdownOchLista(allData);
            } else {
                document.getElementById('drottning-lista').innerHTML = "<p>Kunde inte hämta data.</p>";
            }
        }

        function fyllDropdownOchLista(data) {
            let samhallen = data.samhallen || [];
            let drottningar = data.drottningar || [];
let bigardar = data.bigardar || [];

            let select = document.getElementById('samhalls-koppling');
            select.innerHTML = '<option value="">-- Välj kupa (valfritt) --</option>';
samhallen.forEach(s => {

    let bigard = bigardar.find(
        b => String(b.BigardsID) === String(s.BigardsID)
    );

    let bigardsNamn = bigard
        ? bigard.Namn
        : "Okänd bigård";

    let opt = document.createElement('option');

    opt.value = s.SamhallsID;
    opt.textContent =
        `${bigardsNamn} - ${s.Kupbenamning}`;

    select.appendChild(opt);
});

            let listaDiv = document.getElementById('drottning-lista');
            listaDiv.innerHTML = "";

            if (drottningar.length === 0) {
                listaDiv.innerHTML = "<p>Inga drottningar registrerade ännu.</p>";
                return;
            }

const nuvarandeAr = new Date().getFullYear();

drottningar.sort((a, b) =>
    (parseInt(b.DrottningAr) || 0) -
    (parseInt(a.DrottningAr) || 0)
);

            drottningar.forEach(d => {
let kupaObj = samhallen.find(
    s => String(s.SamhallsID) === String(d.SamhallsID)
);

let kupaNamn = kupaObj
    ? kupaObj.Kupbenamning
    : "Ej placerad i kupa";

let bigardsNamn = "Okänd bigård";

if (kupaObj) {
    let bigardObj = bigardar.find(
        b => String(b.BigardsID) === String(kupaObj.BigardsID)
    );

    if (bigardObj) {
        bigardsNamn = bigardObj.Namn;
    }
}

                let drottningAr = parseInt(d.DrottningAr) || nuvarandeAr;
                let alder = nuvarandeAr - drottningAr;
                if (alder < 0) alder = 0;

                let arText = alder === 0 ? "Årets (0 år)" : alder === 1 ? "1 år gammal" : `${alder} år gammal`;
                
                let letVarningHTML = "";
                let kortBorderColor = '#e67e22';

                if (alder >= 2 && d.Status === "Aktiv i kupa") {
                    kortBorderColor = '#c0392b';
                    letVarningHTML = `<div style="background: #fadbd8; color: #900c3f; padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; margin-top: 5px; font-weight: bold;">⚠️ Bör ses över / Planera drottningbyte (ålder: ${alder} år)</div>`;
                }

                let item = document.createElement('div');
                item.className = 'log-item';
                item.style.borderLeftColor = kortBorderColor;
                item.innerHTML = `
                    <p style="margin-top: 0;"><strong>👑 ${d.Namn || 'Namnlös'}</strong> (${d.Ras || 'Okänd ras'}) &nbsp;|&nbsp; Status: <em>${d.Status || 'Aktiv'}</em></p>
<p>
🏠 <strong>${bigardsNamn}</strong> → ${kupaNamn}
</p>
                    <p>📅 Årgång: ${d.DrottningAr || '-'} (${arText}) | Färg: ${d.Farg || '-'}</p>
                    ${letVarningHTML}
                    <p style="font-size: 0.9rem; color: #555; margin: 0.3rem 0;">
                        Svärmtröghet: ${d.Svarmtroghet || '-'} | Humör: ${d.Temperament || '-'}<br>
                        Honung: ${d.Honungsprestanda || '-'} | Yngel: ${d.Yngelsattning || '-'}
                    </p>
                    ${d.Anteckningar ? `<p><em>Anteckning: ${d.Anteckningar}</em></p>` : ''}
                `;
                listaDiv.appendChild(item);
            });
        }

        document.getElementById('drottning-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('drottning-btn');
            btn.disabled = true;
            btn.textContent = "Sparar drottning...";

            const autoID = skapaID("DR");
			
            const formData = {
                DrottningsID: autoID,
                Namn: document.getElementById('namn').value,
                SamhallsID: document.getElementById('samhalls-koppling').value,
                DrottningAr: document.getElementById('drottning-ar').value,
                Farg: document.getElementById('farg').value,
                Ras: document.getElementById('ras').value,
                Status: document.getElementById('status').value,
                Svarmtroghet: document.getElementById('svarmtroghet').value,
                Temperament: document.getElementById('temperament').value,
                Honungsprestanda: document.getElementById('honungsprestanda').value,
                Yngelsattning: document.getElementById('yngelsattning').value,
                Anteckningar: document.getElementById('anteckningar').value
            };

            await skickaDataTillMolnet("Drottningar", formData, "drottningar.html");
            document.getElementById('drottning-form').reset();
document.getElementById('drottning-ar').value =
    new Date().getFullYear();
            btn.disabled = false;
            btn.textContent = "Spara drottning";
        });

        laddaDrottningarData();

laddaSnabbKnapp(
    "⬆️",
    "window.scrollTo({top:0,behavior:'smooth'})"
);
	
		
    </script>
</body>
</html>
