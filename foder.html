<!-- Filnamn: foder.html -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Fodring & Vinterfoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header med brödsmulor och info-knapp -->
    <script src="header.js"></script>
    <script>
        // Info-knappen inbakad i brödsmulorna
        let breadcrumbs = '<div style="display: flex; align-items: center; gap: 0.4rem;"><a href="index.html" style="color: white; text-decoration: none;">🏠 Hem</a><span> &gt; </span><span>Fodring</span></div><button class="info-btn" onclick="oppnaInfoModal()" title="Om sidan">i</button>';

        // Informationstext till modalen som genereras av header.js
        let infoInnehall = `
            <p style="margin-top: 0; color: #555; font-size: 0.95rem; line-height: 1.5;">
                Här registrerar och följer du upp alla foderinsatser för dina bigårdar och samhällen, såsom sockerlag, foderkakor eller vinterinvintring.
            </p>
            <ul style="color: #555; font-size: 0.9rem; padding-left: 1.2rem; line-height: 1.4;">
                <li><strong>Bigård & Kupa:</strong> Välj först vilken bigård kupan tillhör för att filtrera fram rätt samhälle.</li>
                <li><strong>Fodertyp & Mängd:</strong> Ange exakt typ av foder (t.ex. sockerlag 60% eller Apifonda) samt åtgången i kg eller liter.</li>
                <li><strong>Historik:</strong> Alla sparade foderinsatser sorteras automatiskt med nyaste först i listan nedan.</li>
            </ul>
        `;

        laddaHeader("🍯 Fodring & Vinterfoder", breadcrumbs, "Om Fodring & Vinterfoder", infoInnehall);
    </script>

    <div class="container">
        <!-- Registrera ny fodring -->
        <div class="card">
            <h3>Registrera foderinsats</h3>
            <form id="foder-form">
                <div class="form-group">
                    <label for="valt-bigard-foder">1. Välj bigård:</label>
                    <select id="valt-bigard-foder" name="BigardsID" required>
                        <option value="">-- Välj bigård --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="valt-samhalle-foder">2. Välj kupa / samhälle:</label>
                    <select id="valt-samhalle-foder" name="SamhallsID" required>
                        <option value="">-- Välj bigård först --</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="datum">Datum:</label>
                        <input type="date" id="datum" name="Datum" required>
                    </div>
                    <div class="form-group">
                        <label for="fodertyp">Fodertyp:</label>
                        <select id="fodertyp" name="Fodertyp">
                            <option value="Sockerlag (60%)">Sockerlag (60%)</option>
                            <option value="Sockerlag (67%)">Sockerlag (67%)</option>
                            <option value="Färdig foderlösning (ApiInvert)">Färdig foderlösning (ApiInvert)</option>
                            <option value="Fruktsocker / Sirap (t.ex. Dulcofruct)">Fruktsocker / Sirap (t.ex. Dulcofruct)</option>
                            <option value="Foderkaka / Apifonda">Foderkaka / Apifonda</option>
                            <option value="Proteintillskott / Pollenkaka">Proteintillskott / Pollenkaka</option>
                            <option value="Honungskaka">Honungskaka</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mangd">Mängd (t.ex. 12 kg socker / liter):</label>
                    <input type="text" id="mangd" name="Mangd" placeholder="T.ex. 12 kg" required>
                </div>

                <div class="form-group">
                    <label for="anteckningar">Anteckningar:</label>
                    <textarea id="anteckningar" name="Anteckningar" placeholder="T.ex. Inför invintring, flusterfoder"></textarea>
                </div>

                <button type="submit" class="btn" id="foder-btn" style="background-color: #27ae60;">Spara fodring</button>
            </form>
        </div>

        <!-- Foderhistorik -->
        <div class="card">
            <h3>Foderhistorik</h3>
            <div id="foder-lista">
                <p>Laddar foderdata...</p>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = localStorage.getItem("myBeeApp_url");

        // Sätt dagens datum som standard
        document.getElementById('datum').valueAsDate = new Date();

        function laddaFoderData() {
            if (!WEB_APP_URL) {
                window.location.href = "index.html";
                return;
            }

            let allData = null;
            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");

            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    bearbetaOchVisaData(allData);
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            } else {
                document.getElementById('foder-lista').innerHTML = "<p>Laddar data från molnet...</p>";
            }

            if (navigator.onLine) {
                fetch(WEB_APP_URL)
                    .then(response => response.json())
                    .then(data => {
                        sessionStorage.setItem("myBeeApp_globalData", JSON.stringify(data));
                        bearbetaOchVisaData(data);
                    })
                    .catch(error => {
                        console.error("Fel vid laddning:", error);
                        if (!cachedData) {
                            document.getElementById('foder-lista').innerHTML = "<p>Kunde inte hämta data från molnet.</p>";
                        }
                    });
            }
        }

        function bearbetaOchVisaData(data) {
            fyllBigardarDropdown(data);
            visaFoderHistorik(data);
            
            // Uppdatera även kup-dropdownen om en bigård redan är vald
            let valdBigardID = document.getElementById('valt-bigard-foder').value;
            if (valdBigardID) {
                uppdateraKuporDropdown(valdBigardID, data);
            }
        }

        function fyllBigardarDropdown(data) {
            let bigårdar = data.bigardar || [];
            let select = document.getElementById('valt-bigard-foder');
            let nuvarandeVal = select.value;
            
            select.innerHTML = '<option value="">-- Välj bigård --</option>';

            bigårdar.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b.BigardsID;
                opt.textContent = b.Namn;
                select.appendChild(opt);
            });

            if (nuvarandeVal) {
                select.value = nuvarandeVal;
            }
        }

        document.getElementById('valt-bigard-foder').addEventListener('change', function() {
            let valdtBigardsID = this.value;
            let cachedData = sessionStorage.getItem("myBeeApp_globalData") || sessionStorage.getItem("myBeeApp_allData");
            if (!cachedData) return;
            let data = JSON.parse(cachedData);
            uppdateraKuporDropdown(valdtBigardsID, data);
        });

        function uppdateraKuporDropdown(bigardID, data) {
            let samhallenSelect = document.getElementById('valt-samhalle-foder');
            let nuvarandeKupa = samhallenSelect.value;
            samhallenSelect.innerHTML = '<option value="">-- Välj kupa --</option>';

            if (!bigardID) {
                samhallenSelect.innerHTML = '<option value="">-- Välj bigård först --</option>';
                return;
            }

            let samhallen = data.samhallen || [];
            let minaSamhällen = samhallen.filter(s => s.BigardsID === bigardID);
            
            minaSamhällen.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.SamhallsID;
                opt.textContent = s.Kupbenamning;
                samhallenSelect.appendChild(opt);
            });

            if (nuvarandeKupa) {
                samhallenSelect.value = nuvarandeKupa;
            }
        }

        function visaFoderHistorik(data) {
            let fodringLoggar = data.fodring || [];
            let samhallen = data.samhallen || [];
            let bigardar = data.bigardar || [];
            let listaDiv = document.getElementById('foder-lista');
            listaDiv.innerHTML = "";

            if (fodringLoggar.length === 0) {
                listaDiv.innerHTML = "<p>Inga foderinsatser registrerade ännu.</p>";
                return;
            }

            // Sortera nyast först
            fodringLoggar.sort((a, b) => new Date(b.Datum) - new Date(a.Datum));

            fodringLoggar.forEach(f => {
                let kupa = samhallen.find(s => s.SamhallsID === f.SamhallsID);
                let bigard = bigardar.find(b => b.BigardsID === f.BigardsID);
                let kupaNamn = kupa ? kupa.Kupbenamning : "Okänd kupa";
                let bigardNamn = bigard ? bigard.Namn : "Okänd bigård";
                let kortDatum = f.Datum ? f.Datum.substring(0, 10) : "";

                let item = document.createElement('div');
                item.className = 'log-item';
                item.style.borderLeftColor = '#f39c12';
                item.innerHTML = `
                    <p style="margin-top: 0;"><strong>📅 ${kortDatum}</strong> - ${bigardNamn} / <strong>${kupaNamn}</strong></p>
                    <p>🍯 <strong>Typ:</strong> ${f.Fodertyp || 'Foder'} | <strong>Mängd:</strong> ${f.Mangd || '-'}</p>
                    ${f.Anteckningar ? `<p><em>Anteckning: ${f.Anteckningar}</em></p>` : ''}
                `;
                listaDiv.appendChild(item);
            });
        }

        document.getElementById('foder-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('foder-btn');
            btn.disabled = true;
            btn.textContent = "Sparar fodring...";

            const autoID = "FD" + Math.floor(1000 + Math.random() * 9000);
            const formData = {
                sheet: "Fodring",
                FoderID: autoID,
                BigardsID: document.getElementById('valt-bigard-foder').value,
                SamhallsID: document.getElementById('valt-samhalle-foder').value,
                Datum: document.getElementById('datum').value,
                Fodertyp: document.getElementById('fodertyp').value,
                Mangd: document.getElementById('mangd').value,
                Anteckningar: document.getElementById('anteckningar').value
            };

            if (!navigator.onLine) {
                sparaTillOfflineKoe(formData);
                alert("Ingen internettäckning! Fodring har sparats lokalt och synkas automatiskt senare.");
                document.getElementById('foder-form').reset();
                document.getElementById('datum').valueAsDate = new Date();
                btn.disabled = false;
                btn.textContent = "Spara fodring";
                return;
            }

            fetch(WEB_APP_URL + "?sheet=Fodring", {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(result => {
                if (result && (result.status === "success" || result.result === "success")) {
                    alert("Fodring har sparats!");
                    document.getElementById('foder-form').reset();
                    document.getElementById('datum').valueAsDate = new Date();
                    sessionStorage.removeItem("myBeeApp_globalData");
                    sessionStorage.removeItem("myBeeApp_allData");
                    laddaFoderData();
                } else {
                    throw new Error(result.message || "Okänt fel vid sparande");
                }
            })
            .catch(error => {
                console.warn("Kunde inte nå servern, sparar lokalt...", error);
                sparaTillOfflineKoe(formData);
                alert("Tappade anslutningen. Fodringen har sparats lokalt i kö.");
                document.getElementById('foder-form').reset();
                document.getElementById('datum').valueAsDate = new Date();
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = "Spara fodring";
            });
        });

        function sparaTillOfflineKoe(newItem) {
            let koe = JSON.parse(localStorage.getItem("myBeeApp_offlineKoe") || "[]");
            koe.push(newItem);
            localStorage.setItem("myBeeApp_offlineKoe", JSON.stringify(koe));
        }

        laddaFoderData();
    </script>
</body>
</html>
