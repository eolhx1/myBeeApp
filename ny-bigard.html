<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBeeApp - Bigård</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Generera gemensam header och dynamisk rubrik -->
    <script src="header.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        const rubrikText = editId ? "🐝 Redigera bigård" : "🐝 Lägg till ny bigård";

        laddaHeader(rubrikText, '<a href="index.html">🏠 Hem</a><span> &gt; </span><span id="breadcrumb-text">Ny bigård</span>');
    </script>

    <div class="container">
        <div id="setup-screen" style="display: none;">
            <h2>Anslut din app</h2>
            <input type="text" id="url-input" placeholder="Web App URL...">
            <button onclick="sparaUrl()">Spara länk</button>
        </div>

        <form id="bigard-form" style="display: none;">
            <!-- Dold input för ID om vi redigerar -->
            <input type="hidden" id="bigards-id" name="BigardsID">

            <div class="form-group">
                <label for="status">Status:</label>
                <select id="status" name="Status">
                    <option value="Aktiv">Aktiv</option>
                    <option value="Inaktiv">Inaktiv / Ej aktiv</option>
                </select>
            </div>

            <div class="form-group">
                <label for="namn">Bigårdens namn:</label>
                <input type="text" id="namn" name="Namn" required placeholder="T.ex. Hemmabigården">
            </div>

            <div class="form-group">
                <label for="typ">Typ av bigård:</label>
                <select id="typ" name="Typ">
                    <option value="Produktionsbigård">Produktionsbigård</option>
                    <option value="Avelsbigård">Avelsbigård</option>
                    <option value="Inflyttningsbi / Avläggare">Inflyttningsbi / Avläggare</option>
                    <option value="Drönarstation">Drönarstation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="antal">Antal samhällen:</label>
                <input type="number" id="antal" name="AntalSamhallen" value="1" min="0">
            </div>

            <div class="form-group">
                <label for="datum">Etableringsdatum:</label>
                <input type="date" id="datum" name="Etableringsdatum">
            </div>

            <div class="form-group">
                <label for="lat">Latitud (för karta):</label>
                <input type="text" id="lat" name="Latitud" placeholder="T.ex. 59.3293">
            </div>

            <div class="form-group">
                <label for="lon">Longitud (för karta):</label>
                <input type="text" id="lon" name="Longitud" placeholder="T.ex. 18.0686">
            </div>

            <div class="form-group">
                <label for="anteckningar">Anteckningar:</label>
                <textarea id="anteckningar" name="Anteckningar" placeholder="Kort beskrivning..."></textarea>
            </div>

            <button type="submit" class="btn" id="submit-btn">Spara ändringar</button>
        </form>

        <a href="index.html" class="back-link" style="display:none;">← Tillbaka till översikten</a>
    </div>

    <script>
        if (!editId) {
            document.getElementById('datum').valueAsDate = new Date();
            document.getElementById('submit-btn').textContent = "Spara bigård";
        }

        function initForm() {
            const savedUrl = localStorage.getItem("myBeeApp_url");
            if (!savedUrl) {
                document.getElementById("setup-screen").style.display = "block";
                document.getElementById("bigard-form").style.display = "none";
            } else {
                document.getElementById("setup-screen").style.display = "none";
                document.getElementById("bigard-form").style.display = "block";
                if (editId) {
                    laddaDataForRedigering(savedUrl, editId);
                }
            }
        }

        async function laddaDataForRedigering(webAppUrl, id) {
            let found = null;

            const cachedData = sessionStorage.getItem("myBeeApp_globalData");
            if (cachedData) {
                try {
                    let globalData = JSON.parse(cachedData);
                    if (globalData.bigardar) {
                        found = globalData.bigardar.find(b => String(b.BigardsID) === String(id));
                    }
                } catch (e) {
                    console.error("Kunde inte läsa cache", e);
                }
            }

            if (!found && navigator.onLine) {
                try {
                    let response = await fetch(`${webAppUrl}?sheet=Bigardar`);
                    let data = await response.json();
                    found = data.find(b => String(b.BigardsID) === String(id));
                } catch (e) {
                    console.error("Kunde inte ladda data via nätverket", e);
                }
            }

            if (found) {
                document.getElementById('bigards-id').value = found.BigardsID || "";
                document.getElementById('status').value = found.Status || "Aktiv";
                document.getElementById('namn').value = found.Namn || "";
                document.getElementById('typ').value = found.Typ || "Produktionsbigård";
                document.getElementById('antal').value = found.AntalSamhallen || 0;
                document.getElementById('datum').value = found.Etableringsdatum ? found.Etableringsdatum.split('T')[0] : "";

                let latVal = String(found.Latitud || "");
                let lonVal = String(found.Longitud || "");

                document.getElementById('lat').value = (latVal.includes("T") || latVal.length > 15) ? "" : latVal;
                document.getElementById('lon').value = (lonVal.includes("T") || lonVal.length > 15) ? "" : lonVal;

                document.getElementById('anteckningar').value = found.Anteckningar || "";
                document.getElementById('breadcrumb-text').textContent = found.Namn || "Redigera bigård";
            }
        }

        document.getElementById('bigard-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const WEB_APP_URL = localStorage.getItem("myBeeApp_url");
            if (!WEB_APP_URL) {
                alert("Ingen anslutningslänk hittades.");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Sparar...";

            const currentId = document.getElementById('bigards-id').value || ("B" + Math.floor(1000 + Math.random() * 9000));

            const formData = {
                sheet: "Bigardar",
                BigardsID: currentId,
                Status: document.getElementById('status').value,
                Namn: document.getElementById('namn').value,
                Typ: document.getElementById('typ').value,
                AntalSamhallen: document.getElementById('antal').value,
                Etableringsdatum: document.getElementById('datum').value,
                Latitud: document.getElementById('lat').value,
                Longitud: document.getElementById('lon').value,
                Anteckningar: document.getElementById('anteckningar').value
            };

            if (!navigator.onLine) {
                sparaTillOfflineKoe(formData);
                alert("Ingen internettäckning! Ändringen har sparats lokalt på enheten och synkas automatiskt när du är tillbaka online.");
                window.location.href = "index.html";
                return;
            }

            try {
                // Skicka både som URL-parameter och i JSON-kroppen för maximal kompatibilitet med Apps Script
                let targetUrl = `${WEB_APP_URL}?sheet=Bigardar`;

                let response = await fetch(targetUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(formData)
                });

                let result = await response.json();

                if (result && (result.status === "success" || result.result === "success")) {
                    // Rensa cache så att index.html laddar om den färska datan direkt
                    sessionStorage.removeItem("myBeeApp_globalData");
                    alert("Ändringarna har sparats till molnet!");
                    window.location.href = "index.html";
                } else {
                    throw new Error(result.message || "Okänt fel från servern");
                }
            } catch (error) {
                console.warn("Kunde inte nå servern, sparar lokalt i kö...", error);
                sparaTillOfflineKoe(formData);
                alert("Tappade anslutningen till molnet. Ändringen är sparad lokalt och synkas senare!");
                window.location.href = "index.html";
            }
        });

        function sparaTillOfflineKoe(newItem) {
            let koe = JSON.parse(localStorage.getItem("myBeeApp_offlineKoe") || "[]");
            koe.push(newItem);
            localStorage.setItem("myBeeApp_offlineKoe", JSON.stringify(koe));
        }

        initForm();
    </script>
</body>
</html>
